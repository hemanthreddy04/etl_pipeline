<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Medallion Control Plane</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a fixed left rail of grouped sections, a slim top bar that scopes platform and environment,
   one scrolling work area, and a right drawer for forms and details. The three metals carry layer identity. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --line:#D3DAE2; --fg:#16202A; --muted:#566575;
  --accent:#6B3FA0; --accent-fg:#FFFFFF; --accent-soft:#EFE8F7;
  --bronze:#AE5A24; --silver:#4A84B8; --gold:#B98A00;
  --bronze-soft:#F6E9DF; --silver-soft:#E3EDF6; --gold-soft:#F6EFD6;
  --ok:#1B7F45; --warn:#A86200; --bad:#C0362C; --ok-soft:#E0F2E7; --warn-soft:#FBEBD0; --bad-soft:#FBE3E0;
  --rail:#14212C; --rail-fg:#C5D1DB; --rail-muted:#8A9CAC; --rail-active:#243B4E; --rail-line:#263A4A;
  --code-bg:#101C26; --code-fg:#D5E0E8; --code-kw:#B79BEA; --code-str:#E3BE7C; --code-com:#8196A5; --code-num:#9FD6B0;
  --shadow:0 10px 30px rgba(16,28,38,.18);
  --font-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1820; --surface:#16242E; --surface-2:#1E303C; --line:#2B4050; --fg:#E3EBF1; --muted:#97A9B8;
    --accent:#B596EA; --accent-fg:#1A1026; --accent-soft:#2A2542;
    --bronze:#C26F36; --silver:#4A8BCB; --gold:#B08C14;
    --bronze-soft:#3A2718; --silver-soft:#1B3044; --gold-soft:#36300F;
    --ok:#4CC07C; --warn:#E0A33C; --bad:#F0736B; --ok-soft:#143524; --warn-soft:#3A2C10; --bad-soft:#3F1D1A;
    --rail:#0A1218; --rail-fg:#C5D1DB; --rail-muted:#8A9CAC; --rail-active:#1B2D3B; --rail-line:#1D2D39;
    --code-bg:#0A1319; --code-fg:#D5E0E8; --code-kw:#B79BEA; --code-str:#E3BE7C; --code-com:#8196A5; --code-num:#9FD6B0;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1820; --surface:#16242E; --surface-2:#1E303C; --line:#2B4050; --fg:#E3EBF1; --muted:#97A9B8;
  --accent:#B596EA; --accent-fg:#1A1026; --accent-soft:#2A2542;
  --bronze:#C26F36; --silver:#4A8BCB; --gold:#B08C14;
  --bronze-soft:#3A2718; --silver-soft:#1B3044; --gold-soft:#36300F;
  --ok:#4CC07C; --warn:#E0A33C; --bad:#F0736B; --ok-soft:#143524; --warn-soft:#3A2C10; --bad-soft:#3F1D1A;
  --rail:#0A1218; --rail-fg:#C5D1DB; --rail-muted:#8A9CAC; --rail-active:#1B2D3B; --rail-line:#1D2D39;
  --code-bg:#0A1319; --code-fg:#D5E0E8; --code-kw:#B79BEA; --code-str:#E3BE7C; --code-com:#8196A5; --code-num:#9FD6B0;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);overflow:hidden}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:22px;font-weight:700;line-height:1.2}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--font-mono);font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* shell */
.app{height:100%;display:grid;grid-template-columns:228px minmax(0,1fr)}
.rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--rail-line)}
.brand strong{display:block;font:700 15px/1.1 var(--font-display);color:#fff;letter-spacing:.01em}
.brand span.sub{display:block;font-size:11px;color:var(--rail-muted);text-transform:uppercase;letter-spacing:.09em}
.medals{display:flex}
.medals .disc{width:16px;height:16px;margin-right:-5px;box-shadow:0 0 0 2px var(--rail)}
.disc{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted);position:relative}
.disc::after{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid rgba(255,255,255,.55)}
.disc-bronze{background:var(--bronze)} .disc-silver{background:var(--silver)} .disc-gold{background:var(--gold)}
.disc-source,.disc-consumer{background:var(--muted)}
#nav{padding:8px 8px 12px;flex:1}
.nav-group{margin-top:10px}
.nav-group h6{margin:0;padding:6px 8px 4px;font:600 10.5px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--rail-muted)}
.nav-group a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;color:var(--rail-fg);text-decoration:none;font-size:13.5px;cursor:pointer}
.nav-group a:hover{background:var(--rail-active)}
.nav-group a[aria-current="page"]{background:var(--rail-active);color:#fff;font-weight:600}
.nav-group a .cnt{margin-left:auto;font-size:11px;color:var(--rail-muted);font-variant-numeric:tabular-nums}
.nav-group a .cnt.hot{background:var(--bad);color:#fff;border-radius:8px;padding:0 6px}
.rail-foot{padding:12px 16px;font-size:11.5px;line-height:1.4;color:var(--rail-muted);border-top:1px solid var(--rail-line)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px clamp(16px,2.4vw,28px);background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .menu{display:none}
.search{position:relative;flex:1 1 220px;min-width:0;max-width:440px}
.search input{width:100%}
#qres{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);max-height:320px;overflow:auto;padding:4px}
#qres button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:4px;cursor:pointer}
#qres button:hover,#qres button:focus-visible{background:var(--surface-2)}
#qres .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex:none;width:92px}
.scope{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.scope label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.demo-chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
.content{flex:1;overflow:auto;padding-block:20px 48px;padding-inline:clamp(16px,2.4vw,28px)}
#view{display:flex;flex-direction:column;gap:18px;max-width:1320px}

/* page head */
.ph{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.ph>div:first-child{min-width:0;flex:1 1 320px}
.ph p{color:var(--muted);max-width:68ch;margin-top:4px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;border:1px solid var(--warn);background:var(--warn-soft);font-size:13px}
.banner.info{border-color:var(--line);background:var(--surface-2)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0;max-width:100%}
textarea{font-family:var(--font-mono);font-size:12.5px;width:100%;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.field small{color:var(--muted);font-size:11.5px}
.field input,.field select{width:100%}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:6px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.switch{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch i{position:absolute;inset:0;border-radius:10px;background:var(--line);transition:background .15s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked + i{background:var(--ok)}
.switch input:checked + i::after{transform:translateX(14px)}
.switch input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}

/* panels and tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.panel>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel>header h2{margin-right:auto}
.panel>.body{padding:14px}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
.cols.wide-left{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cols.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols>*{min-width:0}
.scroll-x{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:600 11px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.num,.tbl td.nw{white-space:nowrap}
.tbl td .disc{vertical-align:-1px;margin-right:4px}
.banner>div{min-width:0;flex:1 1 220px}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover,.tbl tbody tr.sel{background:var(--surface-2)}
.tbl input,.tbl select{padding:3px 6px;font-size:12.5px;width:100%;min-width:90px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.empty{padding:22px 14px;color:var(--muted);text-align:center}

/* status and chips */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;background:var(--surface-2)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.st.ok{background:var(--ok-soft)} .st.ok::before{background:var(--ok)}
.st.bad{background:var(--bad-soft)} .st.bad::before{background:var(--bad);border-radius:1px}
.st.warn{background:var(--warn-soft)} .st.warn::before{background:var(--warn);border-radius:1px;transform:rotate(45deg)}
.st.run{background:var(--accent-soft)} .st.run::before{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.st.run::before{animation:none}*{transition:none!important}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.chip.pii{border-color:var(--bad)}
.chip.az{border-color:var(--silver)} .chip.gcp{border-color:var(--gold)}
.tags{display:flex;gap:4px;flex-wrap:wrap}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kpi .l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font:700 22px/1.2 var(--font-display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted)}

/* medallion flow */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow-step{flex:1 1 150px;min-width:0;padding:14px;background:none;border:0;text-align:left;cursor:pointer;border-radius:6px}
.flow-step:hover{background:var(--surface-2)}
.flow-step span{display:block}
.flow-step .t{display:flex;align-items:center;gap:8px;font:600 14px var(--font-display)}
.flow-step .t .disc{width:18px;height:18px}
.flow-step .n{font:700 20px/1.2 var(--font-display);font-variant-numeric:tabular-nums;margin-top:8px}
.flow-step .s{font-size:12px;color:var(--muted)}
.flow-arrow{flex:0 0 auto;align-self:center;color:var(--muted);font-size:18px;padding:0 2px}
.layer-band{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:6px;flex-wrap:wrap}
.layer-band.bronze{background:var(--bronze-soft)} .layer-band.silver{background:var(--silver-soft)} .layer-band.gold{background:var(--gold-soft)}
.layer-band .disc{width:34px;height:34px}
.layer-band .disc::after{inset:4px;border-width:2px}
.layer-band ul{margin:6px 0 0;padding-left:18px;color:var(--fg)}
.layer-band>div{flex:1 1 260px;min-width:0}

.plan-step{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line)}
.plan-step:last-child{border-bottom:0}
.plan-step .disc{margin-top:4px}
.plan-step .grow{flex:1;min-width:0}
.plan-step.hold{color:var(--muted)}
.ctl-side{display:flex;flex-direction:column;gap:18px;min-width:0;position:sticky;top:0;max-height:calc(100dvh - 110px);overflow-y:auto}
@media (max-width:860px){.ctl-side{position:static;max-height:none;overflow:visible}}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:500;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* code */
.code{background:var(--code-bg);color:var(--code-fg);border-radius:6px;overflow:hidden;min-width:0}
.code-head{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.08);font:12px var(--font-mono);color:var(--code-com)}
.code-head span{margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-head button{border:1px solid rgba(255,255,255,.2);background:none;color:var(--code-fg);border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer}
.code pre{margin:0;padding:12px 14px;overflow:auto;max-height:520px;font:12.5px/1.55 var(--font-mono);tab-size:4}
.code .kw{color:var(--code-kw)} .code .str{color:var(--code-str)} .code .com{color:var(--code-com);font-style:italic} .code .nm{color:var(--code-num)}

/* wizard */
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s}
.steps button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 12px 4px 4px;cursor:pointer;font-size:13px;font-weight:500}
.steps button::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font:600 12px var(--font-mono)}
.steps button[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.steps button[aria-current="step"]::before{background:var(--accent);color:var(--accent-fg)}
.steps button.done::before{background:var(--ok);color:#fff;content:"\2713"}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;color:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:11px var(--font-body)}
.chart text.lbl{fill:var(--fg);font-weight:600}
.chart .ring{stroke:var(--surface);stroke-width:2}
.chart .xhair{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;min-width:130px}
.tip b{display:block;margin-bottom:4px}
.tip .row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .row i{width:12px;height:2px;flex:none}
.tip .row span{color:var(--muted);margin-right:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i:not(.disc){display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.legend .disc{margin-right:6px;vertical-align:-1px}
.bars{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:8px 10px;align-items:center;font-size:13px}
.bars .track{height:14px}
.bars .bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.bars .bar.bronze{background:var(--bronze)} .bars .bar.silver{background:var(--silver)} .bars .bar.gold{background:var(--gold)}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}

/* dag + lineage */
.graph svg{display:block;color:var(--fg)}
.graph .edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.graph .node rect{fill:var(--surface);stroke:var(--line);stroke-width:1}
.graph .node{cursor:pointer}
.graph .node:hover rect,.graph .node:focus-visible rect{stroke:var(--accent)}
.graph .node.sel rect{stroke:var(--accent);stroke-width:2}
.graph .node text{fill:var(--fg);font:12px var(--font-body)}
.graph .node text.sub{fill:var(--muted);font-size:10.5px}
.graph .dim{opacity:.22}
.graph .dot-queued{fill:var(--line)} .graph .dot-running,.graph .dot-retry{fill:var(--accent)} .graph .dot-success{fill:var(--ok)} .graph .dot-failed{fill:var(--bad)} .graph .dot-upstream_failed,.graph .dot-skipped{fill:var(--warn)} .graph .dot-idle{fill:var(--muted)}
.graph .l-bronze{fill:var(--bronze)} .graph .l-silver{fill:var(--silver)} .graph .l-gold{fill:var(--gold)} .graph .l-source,.graph .l-consumer,.graph .l-ops{fill:var(--muted)}
.graph .colhead{fill:var(--muted);font:600 10.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase}
.gantt{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:6px 10px;align-items:center;font-size:12.5px}
.gantt .lane{position:relative;height:12px;background:var(--surface-2);border-radius:3px}
.gantt .lane i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--ok);min-width:3px}
.gantt .lane i.failed{background:var(--bad)} .gantt .lane i.running,.gantt .lane i.retry{background:var(--accent)} .gantt .lane i.queued,.gantt .lane i.upstream_failed{background:var(--line)}

/* logs */
.logs{font:12px/1.6 var(--font-mono);background:var(--code-bg);color:var(--code-fg);border-radius:6px;padding:10px 12px;max-height:340px;overflow:auto}
.logs div{white-space:pre-wrap;overflow-wrap:anywhere}
.logs .t{color:var(--code-com)} .logs .INFO{color:var(--code-num)} .logs .WARN{color:var(--code-str)} .logs .ERROR{color:#FF9A92}

/* lists */
.list{display:flex;flex-direction:column}
.list>div,.list>li{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .grow b{display:block;font-weight:600}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile header{display:flex;align-items:flex-start;gap:8px}
.tile header h3{margin-right:auto;font-size:14px;overflow-wrap:anywhere}
.tile .mono{overflow-wrap:anywhere;color:var(--muted)}
.tile footer{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.mono-badge{display:grid;place-items:center;width:30px;height:30px;border-radius:4px;background:var(--surface-2);font:600 11px var(--font-mono);flex:none}
.concept{padding:12px 14px;border-bottom:1px solid var(--line)}
.concept h3{font-size:14px}
.concept p{color:var(--muted);max-width:75ch;margin-top:2px}
.concept .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:12.5px}

/* agent */
.chat{display:flex;flex-direction:column;gap:10px;padding:14px;max-height:560px;overflow:auto}
.msg{max-width:min(100%,760px);padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.msg.user{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg.tool{font-size:12.5px;background:var(--surface-2);border-style:dashed;width:100%}
.msg.tool summary{cursor:pointer;font-family:var(--font-mono)}
.msg.tool pre{margin:6px 0 0;font:12px/1.5 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.msg .who{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 10px;font-size:12.5px;cursor:pointer;text-align:left}
.tree{font:12.5px/1.7 var(--font-mono);white-space:pre;overflow:auto;margin:0}

/* drawer and toasts */
.scrim{position:fixed;inset:0;background:rgba(10,18,24,.45);z-index:40}
.drawer{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin-right:auto;font-size:16px;overflow-wrap:anywhere}
#drawer-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
#drawer-body form{display:flex;flex-direction:column;gap:12px}
.toasts{position:fixed;z-index:60;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:9px 12px;border-radius:6px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:8px}
.toast::before{content:"\2713";font-weight:700}
.toast.warn::before{content:"!"} .toast.bad::before{content:"\2715"}

@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;z-index:45;top:0;bottom:0;left:0;width:248px;transform:translateX(-100%);transition:transform .18s;padding-top:env(safe-area-inset-top,0px)}
  .rail.open{transform:none}
  .topbar .menu{display:block}
  .scope{margin-left:0;width:100%}
  .cols.wide-left,.cols.split{grid-template-columns:minmax(0,1fr)}
  .flow-arrow{display:none}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
}

</head><body>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Sections">
    <div class="brand">
      <span class="medals" aria-hidden="true"><i class="disc disc-bronze"></i><i class="disc disc-silver"></i><i class="disc disc-gold"></i></span>
      <div><strong>Medallion</strong><span class="sub">Control Plane</span></div>
    </div>
    <div id="nav"></div>
    <div class="rail-foot">Connected to your warehouses. Runs here execute real SQL and change real tables.</div>
  </nav>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu" id="menu-btn" data-act="toggleRail" aria-label="Open sections">&#9776;</button>
      <div class="search">
        <input id="q" type="search" placeholder="Search tables, pipelines, concepts" autocomplete="off" aria-label="Search">
        <div id="qres" hidden></div>
      </div>
      <div class="scope">

          <select id="platform" data-change="setPlatform">

          </select>
        </label>
        <span class="chip" id="env-chip" title="Environment of this service"></span>
        <span class="st ok" id="live-chip">Live</span>
      </div>
    </header>
    <main class="content" id="content"><div id="view"></div></main>
  </div>
</div>
<div class="scrim" id="scrim" hidden data-act="closeAll"></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="drawer-title">
  <div class="drawer-head"><h2 id="drawer-title"></h2><button class="btn sm" data-act="closeDrawer">Close</button></div>
  <div id="drawer-body"></div>
</aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MIN=60e3,HOUR=3600e3,DAY=86400e3;
const fmt=n=>{n=Number(n)||0;const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(1)+'M':a>=1e4?(n/1e3).toFixed(0)+'K':a>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n))};
const num=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const usd=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const dur=s=>{s=Math.max(0,Math.round(s));return s<60?s+'s':s<3600?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m'};
const ago=ts=>{const d=Date.now()-ts;if(d<0){const f=-d;return f<HOUR?'in '+Math.max(1,Math.round(f/MIN))+' min':f<DAY?'in '+Math.round(f/HOUR)+' h':'in '+Math.round(f/DAY)+' d'}
  return d<MIN?'just now':d<HOUR?Math.round(d/MIN)+' min ago':d<DAY?Math.round(d/HOUR)+' h ago':Math.round(d/DAY)+' d ago'};
const iso=ts=>new Date(ts).toISOString();
const dstr=ts=>iso(ts).slice(0,10);
const clock=ts=>iso(ts).slice(11,19);
const stamp=ts=>iso(ts).slice(0,16).replace('T',' ')+' UTC';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- state: a cache of what the service holds ---------- */
const S={view:'overview',platform:'all',env:'dev',settings:{env:'dev',channels:{},agent:false,protected:true},
  connections:[],tables:[],pipelines:[],sources:[],runs:[],logs:[],alerts:[],rules:[],quarantine:[],audit:[],approvals:[],roles:[],mappings:{},drift:[],
  cache:{},ready:false,
  ui:{layerTable:{},orchPid:null,lineageSel:null,mapTable:null,govTab:'access',logLevel:'all',logPid:'all',logText:'',conceptCat:'All',conceptText:'',monRange:14},
  builder:null,agent:{msgs:[],busy:false,pending:false}};
const CONSUMERS=[];

/* ---------- small renderers ---------- */
const ST={success:['ok','Succeeded'],running:['run','Running'],failed:['bad','Failed'],queued:['','Queued'],retry:['run','Retrying'],upstream_failed:['warn','Upstream failed'],skipped:['','Skipped'],
  healthy:['ok','Healthy'],degraded:['warn','Degraded'],down:['bad','Unreachable'],active:['ok','Active'],paused:['warn','Paused'],pass:['ok','Pass'],warn:['warn','Warning'],fail:['bad','Fail'],
  terminated:['','Stopped'],starting:['run','Starting'],stopping:['run','Stopping'],enabled:['ok','Enabled'],disabled:['','Disabled'],idle:['','Not run yet'],testing:['run','Testing'],
  open:['bad','Open'],ack:['','Acknowledged'],pending:['warn','Pending'],deployed:['ok','Deployed']};
const st=(s,label)=>{const d=ST[s]||['',s];return `<span class="st ${d[0]}">${esc(label||d[1])}</span>`};
const plat=p=>p==='azure'?'<span class="chip az">Azure</span>':p==='gcp'?'<span class="chip gcp">GCP</span>':'<span class="chip">Local</span>';
const disc=l=>`<i class="disc disc-${l}" aria-hidden="true"></i>`;
const layerChip=l=>`<span class="chip">${disc(l)}${cap(l)}</span>`;
const head=(title,sub,actions='')=>`<div class="ph"><div><h1>${title}</h1><p>${sub}</p></div><div class="ph-act">${actions}</div></div>`;
const inScope=p=>S.platform==='all'||p===S.platform||p==='any';
const pipe=id=>S.pipelines.find(p=>p.id===id);
const tbl=id=>S.tables.find(t=>t.id===id);
const conn=id=>S.connections.find(c=>c.id===id);

/* ---------- toast, drawer, audit, log ---------- */
function toast(msg,kind='ok'){const el=document.createElement('div');el.className='toast '+(kind==='ok'?'':kind);const s=document.createElement('span');s.textContent=msg;el.appendChild(s);$('#toasts').appendChild(el);setTimeout(()=>el.remove(),4200)}
function openDrawer(title,html){$('#drawer-title').textContent=title;$('#drawer-body').innerHTML=html;$('#drawer').hidden=false;$('#scrim').hidden=false;const f=$('#drawer-body input,#drawer-body select,#drawer-body textarea,#drawer-body button');if(f)f.focus()}
function closeDrawer(){$('#drawer').hidden=true;if(!$('#rail').classList.contains('open'))$('#scrim').hidden=true;S.ui.drawerRun=null}

/* ---------- talking to the service ---------- */
function token(){try{return sessionStorage.getItem('mcp-token')||''}catch(e){return S.ui.token||''}}
function setToken(v){S.ui.token=v;try{sessionStorage.setItem('mcp-token',v)}catch(e){}}
async function api(method,path,body){
  const chip=$('#live-chip');let r;
  try{r=await fetch(path,{method,headers:{'content-type':'application/json',...(token()?{authorization:'Bearer '+token()}:{})},body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){chip.className='st bad';chip.textContent='Offline';throw new Error('The service cannot be reached')}
  chip.className='st ok';chip.textContent='Live';
  if(r.status===401){askToken();throw new Error('Enter the access token to continue')}
  const json=(r.headers.get('content-type')||'').includes('json');const data=json?await r.json():await r.blob();
  if(!r.ok)throw new Error(json&&data&&data.error?data.error:`The service answered ${r.status}`);
  return data}
/* run a change, then pull fresh state; errors become a message instead of a crash */
async function act(fn,done){try{const out=await fn();await sync(true);if(done)toast(typeof done==='function'?done(out):done);return out}catch(e){toast(e.message,'bad');return null}}
let LAST='';
async function sync(force){
  const d=await api('GET','/api/state');const sig=JSON.stringify({...d,now:0});
  if(sig===LAST&&!force&&S.ready)return false;LAST=sig;
  Object.assign(S,{settings:d.settings,env:d.settings.env,connections:d.connections,pipelines:d.pipelines,tables:d.tables,sources:d.sources,runs:d.runs,logs:d.logs,alerts:d.alerts,rules:d.rules,
    quarantine:d.quarantine,mappings:d.mappings,drift:d.drift,audit:d.audit,approvals:d.approvals,roles:d.roles,ready:true});
  $('#env-chip').textContent=S.env;refresh();if(S.ui.drawerRun&&!$('#drawer').hidden)ACT.openRun({id:S.ui.drawerRun,keep:'1'});return true}
/* data that is fetched on demand (previews, compute, tools): render "loading", fetch once, render again */
function remote(key,loader){const c=S.cache[key];if(c)return c;S.cache[key]={loading:true};
  loader().then(d=>{S.cache[key]={data:d}},e=>{S.cache[key]={error:e.message}}).finally(()=>refresh());return S.cache[key]}
function remoteHtml(c,fn){return c.loading?'<div class="empty">Loading from the service</div>':c.error?`<div class="banner">${esc(c.error)}</div>`:fn(c.data)}
function askToken(){if($('#token-form'))return;openDrawer('Access token',`<p class="muted">This control plane is protected. Enter the access token that was set when the service was deployed.</p><form data-form="saveToken" id="token-form"><label class="field"><span>Access token</span><input type="password" id="tk" name="token" autocomplete="off" required></label><div><button class="btn primary">Continue</button></div></form>`)}
function copyText(text,btn){const done=()=>{if(btn){const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1400)}};
  try{navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done))}catch(e){fallbackCopy(text,done)}}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Copy is blocked here. Select the text and copy it manually.','warn')}ta.remove()}

/* ---------- code block with light highlighting ---------- */
const KW='def|import|from|return|if|else|elif|for|in|as|with|raise|not|and|or|None|True|False|lambda|SELECT|FROM|WHERE|GROUP|BY|ORDER|AS|ON|AND|OR|NOT|NULL|IS|JOIN|LEFT|INNER|MERGE|USING|WHEN|MATCHED|THEN|UPDATE|SET|INSERT|INTO|VALUES|ROW|CREATE|REPLACE|TABLE|PARTITION|CLUSTER|ALL|CAST|CASE|END|ELSE|DISTINCT|UNION|OVER|QUALIFY|TRUE|FALSE|true|false|null';
const HL=new RegExp('(#.*$|--\\s.*$)|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')|\\b('+KW+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b','gm');
function hl(src){let out='',i=0;src.replace(HL,(m,c,s,k,n,idx)=>{out+=esc(src.slice(i,idx));out+=`<span class="${c?'com':s?'str':k?'kw':'nm'}">${esc(m)}</span>`;i=idx+m.length;return m});return out+esc(src.slice(i))}
const CODE_STORE={};
function codeBlock(file,src){const id='c'+Object.keys(CODE_STORE).length;CODE_STORE[id]=src;return `<div class="code"><div class="code-head"><span>${esc(file)}</span><button data-act="copyCode" data-id="${id}">Copy</button></div><pre tabindex="0"><code>${hl(src)}</code></pre></div>`}

/* ---------- routing and rendering ---------- */
const VIEWS={},ACT={},CHG={},INP={},FORMS={};
const NAV=[['Operate',['overview','pipelines','orchestration','monitoring']],['Layers',['bronze','silver','gold']],['Build',['builder','controls','mappings','quality']],
  ['Platform',['connections','compute','mcp','agent']],['Govern',['lineage','governance','cicd']],['Learn',['concepts']]];
FORMS.saveToken=f=>{setToken(f.token.trim());closeDrawer();sync(true).then(()=>toast('Signed in'),e=>toast(e.message,'bad'))};
function renderNav(){
  const open=S.alerts.filter(a=>!a.ack).length;
  const counts={pipelines:S.pipelines.filter(p=>inScope(p.platform)).length,connections:S.connections.filter(c=>inScope(c.cloud)).length,mcp:S.approvals.filter(a=>a.status==='pending').length||undefined,quality:S.rules.length,
    bronze:S.tables.filter(t=>t.layer==='bronze'&&inScope(t.platform)).length,silver:S.tables.filter(t=>t.layer==='silver'&&inScope(t.platform)).length,gold:S.tables.filter(t=>t.layer==='gold'&&inScope(t.platform)).length};
  $('#nav').innerHTML=NAV.map(([g,ids])=>`<div class="nav-group"><h6>${g}</h6>${ids.map(id=>{const v=VIEWS[id];const lay=['bronze','silver','gold'].includes(id)?disc(id):'';
    const c=id==='overview'&&open?`<span class="cnt hot" title="Open alerts">${open}</span>`:counts[id]!=null?`<span class="cnt">${counts[id]}</span>`:'';
    return `<a href="#${id}" data-act="go" data-view="${id}" ${S.view===id?'aria-current="page"':''}>${lay}${v.nav}${c}</a>`}).join('')}</div>`).join('');
}
function render(){for(const k in CODE_STORE)delete CODE_STORE[k];renderNav();const v=VIEWS[S.view];if(!S.ready){$('#view').innerHTML='<div class="empty">Connecting to the service</div>';return}$('#view').innerHTML=v.render();if(v.after)v.after()}
function rerender(){setTimeout(()=>{const a=document.activeElement,id=a&&a.id;render();const e=id&&document.getElementById(id);if(e)e.focus()},0)}
function refresh(){const a=document.activeElement;if(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;const c=$('#content'),sc=c.scrollTop;const inner=$$('#view [data-keep]').map(e=>[e.dataset.keep,e.scrollTop]);render();inner.forEach(([k,t])=>{const e=$(`#view [data-keep="${k}"]`);if(e)e.scrollTop=t});c.scrollTop=sc}
function go(view,silent){if(!VIEWS[view])view='overview';S.view=view;$('#qres').hidden=true;if(!silent){try{history.replaceState(null,'','#'+view)}catch(e){try{location.hash=view}catch(_){}}}render();$('#content').scrollTop=0;closeRail()}
function closeRail(){$('#rail').classList.remove('open');if($('#drawer').hidden)$('#scrim').hidden=true}
ACT.go=d=>go(d.view);
ACT.toggleRail=()=>{const r=$('#rail');r.classList.toggle('open');$('#scrim').hidden=!r.classList.contains('open')};
ACT.closeDrawer=()=>closeDrawer();
ACT.closeAll=()=>{$('#drawer').hidden=true;$('#rail').classList.remove('open');$('#scrim').hidden=true;S.ui.drawerRun=null};
ACT.copyCode=(d,el)=>copyText(CODE_STORE[d.id]||el.closest('.code').querySelector('code').textContent,el);
CHG.setPlatform=v=>{S.platform=v;render()};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!e.target.closest('.search'))$('#qres').hidden=true;
  if(!t)return;
  if(e.target.closest('input,select,textarea,label')&&!t.matches('input,select,textarea,label,button'))return;
  if(t.tagName==='A')e.preventDefault();
  const fn=ACT[t.dataset.act];if(fn)fn(t.dataset,t,e);
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-change]');if(t&&CHG[t.dataset.change])CHG[t.dataset.change](t.type==='checkbox'?t.checked:t.value,t.dataset,t)});
document.addEventListener('input',e=>{const t=e.target.closest('[data-input]');if(t&&INP[t.dataset.input])INP[t.dataset.input](t.value,t.dataset,t)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.closest('[data-form]');if(f&&FORMS[f.dataset.form])FORMS[f.dataset.form](Object.fromEntries(new FormData(f)),f)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ACT.closeAll();$('#qres').hidden=true;return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act]:not(button):not(a):not(input):not(select):not(textarea)')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==S.view&&VIEWS[h])go(h,true)});
/* ---------- cron helpers ---------- */
function cronField(f,v,lo){if(f==='*')return true;return f.split(',').some(p=>{const m=p.match(/^(\*|\d+)(?:-(\d+))?(?:\/(\d+))?$/);if(!m)return false;const a=m[1]==='*'?lo:+m[1];const b=m[1]==='*'?99:m[2]!=null?+m[2]:(m[3]?99:a);const s=m[3]?+m[3]:1;return v>=a&&v<=b&&(v-a)%s===0})}
function cronMatch(cron,d){const f=cron.trim().split(/\s+/);if(f.length!==5)return false;return cronField(f[0],d.getUTCMinutes(),0)&&cronField(f[1],d.getUTCHours(),0)&&cronField(f[2],d.getUTCDate(),1)&&cronField(f[3],d.getUTCMonth()+1,1)&&cronField(f[4],d.getUTCDay(),0)}
function nextRuns(cron,n=3){if(cron==='continuous')return [];const out=[];let t=Math.ceil(Date.now()/MIN)*MIN;for(let i=0;i<60*24*8&&out.length<n;i++,t+=MIN){if(cronMatch(cron,new Date(t)))out.push(t)}return out}
function cronText(c){if(c==='continuous')return 'Runs continuously';const f=c.trim().split(/\s+/);if(f.length!==5)return 'Not a valid 5 field cron expression';let m;
  if((m=f[0].match(/^\*\/(\d+)$/))&&f.slice(1).every(x=>x==='*'))return `Every ${m[1]} minutes`;
  if(/^\d+$/.test(f[0])&&f[1]==='*'&&f[2]==='*'&&f[3]==='*'&&f[4]==='*')return `Every hour at minute ${f[0]}`;
  if(/^\d+$/.test(f[0])&&(m=f[1].match(/^\*\/(\d+)$/))&&f[2]==='*')return `Every ${m[1]} hours`;
  if(/^\d+$/.test(f[0])&&/^\d+$/.test(f[1])){const at=`${f[1].padStart(2,'0')}:${f[0].padStart(2,'0')} UTC`;

/* ---------- Silver ---------- */
function genSilver(c){
  const n=names(c),az=c.platform==='azure',cols=parseCols(c.columns),keys=cols.filter(x=>x.key).map(x=>x.name);
  const casts=cols.filter(x=>x.type!=='STRING'),pii=c.maskPii?cols.filter(x=>x.pii).map(x=>x.name):[];
  const k=keys.length?keys:[cols[0]?cols[0].name:'id'],scd2=c.scd==='2',stream=c.kind==='stream';
  const order=cols.some(x=>x.name===c.watermark)?c.watermark:'_ingest_ts';
  const errPath=`${n.src}/_errors/silver/${n.t}/`;
  const tracked=cols.filter(x=>!x.key).map(x=>x.name);
  let s=`# pipelines/silver/silver_${n.t}.py
# Silver holds one clean, typed, deduplicated row per business key.
from pyspark.sql import ${az?'':'SparkSession, '}functions as F, Window${az?'\nfrom delta.tables import DeltaTable':''}
${az?'':`
spark = SparkSession.builder.appName("silver_${n.t}").getOrCreate()
RUN_DATE = spark.conf.get("spark.medallion.run_date")
`}
SOURCE  = "${n.bronze}"
TARGET  = "${az?n.silver:`${n.project}.silver_stg.${n.t}`}"${az?'':'        # staging table, merged into Silver by the DAG'}
ERRORS  = ${az?`"${c.onBad==='stop'?errPath:n.silver+'_quarantine'}"`:`f"${errPath}run_date={RUN_DATE}/"`}
KEYS    = ${pyList(k)}
CASTS   = {${casts.map(x=>`"${x.name}": "${x.type}"`).join(', ')}}   # every column that is not a string
COLUMNS = ${pyList(cols.map(x=>x.name))}

${az?`src = spark.table(SOURCE).where(F.col("_ingest_date") >= F.date_sub(F.current_date(), 1))   # only recent Bronze partitions`:`src = spark.read.format("bigquery").load(SOURCE)`}${stream?`
# Bronze holds the raw event as JSON text, so pull the fields out first
src = src.select(*[F.get_json_object("${az?'payload':'data'}", f"$.{name}").alias(name) for name in COLUMNS], ${az?'"_ingest_ts"':'F.col("publish_time").alias("_ingest_ts")'})`:''}

# 1) Cast. try_cast returns NULL instead of raising when a value cannot be converted
checked = src
for name, dtype in CASTS.items():
    checked = checked.withColumn(f"{name}__typed", F.expr(f"try_cast({name} AS {dtype})"))

# 2) Describe what is wrong with each row: a missing key, or a value that was present but not castable
problems = (
    [F.when(F.col(key).isNull(), F.lit(f"{key} is missing")) for key in KEYS]
    + [F.when(F.col(name).isNotNull() & F.col(f"{name}__typed").isNull(),
              F.concat(F.lit(f"{name} not castable to {dtype}: "), F.col(name)))
       for name, dtype in CASTS.items()]
)
checked = checked.withColumn("_error_reason", F.concat_ws("; ", *problems))
bad  = checked.where("_error_reason <> ''")
good = checked.where("_error_reason = ''")

`;
  s+=c.onBad==='stop'?`# 3) Bad rows stop the pipeline. They are saved with the reason first, then the task fails
#    so the orchestrator retries, alerts, and holds everything downstream.
bad_count = bad.count()
if bad_count > 0:
    bad.write.mode("overwrite").parquet(ERRORS)
    raise ValueError(f"{TARGET}: {bad_count} rows could not be cast. Evidence saved to {ERRORS}")
`:`# 3) Bad rows go to quarantine with the reason, and good rows keep moving
${az?'bad.write.mode("append").option("mergeSchema", "true").saveAsTable(ERRORS)':'bad.write.mode("overwrite").parquet(ERRORS)'}
`;
  s+=`
clean = good.select(
    *[F.col(f"{name}__typed").alias(name) if name in CASTS else F.trim(F.col(name)).alias(name) for name in COLUMNS],
    "_ingest_ts",
)

# Mask personal data before anyone downstream can read it
for name in ${pyList(pii)}:
    clean = clean.withColumn(name, F.sha2(F.lower(F.trim(F.col(name))), 256))
`:''}
# 4) Deduplicate: keep the newest record for each key
w = Window.partitionBy(*KEYS).orderBy(F.col("${order}").desc())
latest = clean.withColumn("_rn", F.row_number().over(w)).where("_rn = 1").drop("_rn")
`;
  const on=k.map(x=>`t.${x} = s.${x}`).join(' AND ');
  if(az&&!scd2)s+=`
# 5) Upsert (SCD Type 1). MERGE is idempotent, so running the same batch twice changes nothing
(
    DeltaTable.forName(spark, TARGET).alias("t")
    .merge(latest.alias("s"), "${on}")
    .whenMatchedUpdateAll()
    .whenNotMatchedInsertAll()
    .execute()
)
`;

# 5) SCD Type 2: keep history. A changed row closes the old version and opens a new one
staged  = latest.withColumn("row_hash", F.sha2(F.concat_ws("||", *${pyList(tracked)}), 256))
target  = DeltaTable.forName(spark, TARGET)
current = target.toDF().where("is_current")
changes = (
    staged.alias("s").join(current.alias("t"), KEYS, "left")
    .where("t.row_hash IS NULL OR t.row_hash <> s.row_hash")
    .select("s.*")
    .localCheckpoint()                                  # freeze the change set before the table is modified
)

(
    target.alias("t")
    .merge(changes.alias("s"), "${on} AND t.is_current")
    .whenMatchedUpdate(set={"is_current": "false", "valid_to": "s._ingest_ts"})
    .execute()
)

(
    changes.withColumn("valid_from", F.col("_ingest_ts"))
    .withColumn("valid_to", F.lit(None).cast("timestamp"))
    .withColumn("is_current", F.lit(True))
    .write.mode("append").saveAsTable(TARGET)
)
`;
  if(!az){const sx=cols.map(x=>x.name);
    s+=`${scd2?`
latest = latest.withColumn("row_hash", F.sha2(F.concat_ws("||", *${pyList(tracked)}), 256))
`:''}
# 5) Write the staging table. The DAG then merges it into Silver with one BigQuery job
(
    latest.write.format("bigquery")
    .option("table", TARGET)
    .option("temporaryGcsBucket", "<temp-bucket>")
    .mode("overwrite")
    .save()
)

# ---------- sql/merge_silver_${n.t}.sql ----------
${scd2?`-- SCD Type 2: close the versions that changed, then insert the new ones
UPDATE \`${n.silver}\` t
SET is_current = FALSE, valid_to = s._ingest_ts
FROM \`${n.project}.silver_stg.${n.t}\` s
WHERE ${on} AND t.is_current AND t.row_hash <> s.row_hash;

INSERT INTO \`${n.silver}\` (${[...sx,'_ingest_ts','row_hash','valid_from','valid_to','is_current'].join(', ')})
SELECT ${sx.map(x=>'s.'+x).join(', ')}, s._ingest_ts, s.row_hash, s._ingest_ts, CAST(NULL AS TIMESTAMP), TRUE
FROM \`${n.project}.silver_stg.${n.t}\` s
LEFT JOIN \`${n.silver}\` t ON ${on} AND t.is_current
WHERE t.${k[0]} IS NULL;`:`-- SCD Type 1 upsert. MERGE is idempotent, so a rerun changes nothing
MERGE \`${n.silver}\` t
USING \`${n.project}.silver_stg.${n.t}\` s
ON ${on}
WHEN MATCHED THEN UPDATE SET ${[...sx.filter(x=>!k.includes(x)),'_ingest_ts'].map(x=>`${x} = s.${x}`).join(', ')}
WHEN NOT MATCHED THEN INSERT ROW;`}
`}
  return s;
}

/* ---------- Gold ---------- */
function genGold(c){
  const n=names(c),az=c.platform==='azure',g=c.gold,cols=parseCols(c.columns),keys=cols.filter(x=>x.key).map(x=>x.name);
  const k=keys.length?keys:[cols[0]?cols[0].name:'id'],dims=String(g.dims||'').split(',').map(x=>x.trim()).filter(Boolean),ms=String(g.measures||'COUNT(*) AS row_count').split('\n').map(x=>x.trim().replace(/,$/,'')).filter(Boolean);
  const from=az?n.silver:`\`${n.silver}\``,tgt=az?n.gold:`\`${n.gold}\``,cur=c.scd==='2'?'\nWHERE is_current':'';
  if(g.type==='dimension'){const attrs=cols.filter(x=>!x.key).map(x=>x.name);
    return `-- pipelines/gold/${n.g}.sql
-- Gold dimension: one row per ${k.join(', ')}${c.scd==='2'?' version':''}, with a surrogate key that facts join on.
CREATE OR REPLACE TABLE ${tgt}
CLUSTER BY ${az?`(${n.t}_sk)`:`${n.t}_sk`}
AS
SELECT
  ${az?`sha2(concat_ws('||', ${[...k,...(c.scd==='2'?['CAST(valid_from AS STRING)']:[])].join(', ')}), 256)`:`FARM_FINGERPRINT(CONCAT(${[...k,...(c.scd==='2'?['valid_from']:[])].map(x=>`CAST(${x} AS STRING)`).join(", '||', ")}))`} AS ${n.t}_sk,
  ${[...k,...attrs].join(',\n  ')}${c.scd==='2'?',\n  valid_from,\n  valid_to,\n  is_current':''},
  ${az?'current_timestamp()':'CURRENT_TIMESTAMP()'} AS _built_at
FROM ${from};
`}
  const grain=[g.dateCol,...dims].filter(Boolean);
  return `-- pipelines/gold/${n.g}.sql
-- Gold aggregate, ready for dashboards. Grain: one row per ${grain.join(', ')||'table'}.
CREATE OR REPLACE TABLE ${tgt}${g.dateCol&&!az?`\nPARTITION BY ${g.dateCol}`:''}${grain.length?`\nCLUSTER BY ${az?`(${grain.slice(0,2).join(', ')})`:(dims.slice(0,2).join(', ')||g.dateCol)}`:''}
AS
SELECT
  ${[...grain,...ms].join(',\n  ')},
  ${az?'current_timestamp()':'CURRENT_TIMESTAMP()'} AS _built_at
FROM ${from}${cur}
GROUP BY ${grain.length?'ALL':'()'};
`.replace('GROUP BY ();\n',';\n');
}

function genOrch(c){

  const b=`bronze_${n.t}`,s=`silver_${n.t}`,g=n.g,retries=+c.retries||0;
  if(c.orch==='dbx'){

    const job={name:`${n.t}_medallion`,...(stream?{continuous:{pause_status:'UNPAUSED'}}:{schedule:{quartz_cron_expression:quartz(c.cron),timezone_id:'UTC',pause_status:'UNPAUSED'}}),max_concurrent_runs:1,
      email_notifications:{on_failure:['data-alerts@example.com']},
      git_source:{git_url:'https://github.com/example/medallion-pipelines',git_provider:'gitHub',git_branch:S.env==='prod'?'main':S.env},
      job_clusters:[{job_cluster_key:'medallion',new_cluster:{spark_version:'15.4.x-scala2.12',node_type_id:'Standard_D4ds_v5',runtime_engine:'PHOTON',autoscale:{min_workers:2,max_workers:8},data_security_mode:'SINGLE_USER'}}],
      tasks:[task(b,`pipelines/bronze/${b}.py`,[]),task(s,`pipelines/silver/${s}.py`,[b]),
        {task_key:g,depends_on:[{task_key:s}],sql_task:{file:{path:`pipelines/gold/${g}.sql`,source:'GIT'},warehouse_id:'<sql-warehouse-id>'},max_retries:retries}]};
    return ['workflows/'+n.t+'_medallion.json',JSON.stringify(job,null,2)+'\n'];

# Checks run after each layer. The severity decides what a failure does:
#   fail       stops the pipeline and alerts
#   quarantine moves the bad rows aside and continues
#   warn       alerts only

bronze.${n.t}_raw:
  - type: row_count
    min: 1

    on_new_column: ${c.evolve==='failOnNewColumns'?'fail':'warn'}

silver.${n.t}:
  - type: not_null

${casts.map(x=>`  - type: castable

gold.${n.g}:

`}

const LAYER_INFO={

  </tbody></table></div></div>${detail}`;

['bronze','silver','gold'].forEach(l=>VIEWS[l]=layerView(l));

VIEWS.mappings={nav:'Mappings',render(){

/* ---------- Data quality ---------- */

const RULE_TYPES=Object.keys(DIM);
const RULE_HELP={not_null:'Leave the rule detail empty.',unique:'Leave the rule detail empty.',range:'Two numbers, such as 0 to 100000, or "at least 0".',accepted_values:'The allowed values, separated by commas.',regex:'A regular expression the value must match.',

    <div class="panel"><header><h2>Score by dimension</h2></header>${dims.length?`<table class="tbl"><tbody>${dims.map(([d,v,n])=>`<tr><td><b>${d}</b></td><td class="muted">${n} checks</td><td class="r num"><b>${v.toFixed(2)}%</b></td><td class="r">${grade(v)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Scores appear once checks have run.</div>'}</div>
  </div>
  <div class="panel"><header><h2>Checks</h2><span class="muted small">${rules.filter(r=>ruleState(r)==='pass').length} passing, ${rules.filter(r=>ruleState(r)==='warn').length} warning, ${rules.filter(r=>ruleState(r)==='fail').length} failing</span></header><div class="scroll-x"><table class="tbl"><thead><tr><th>On</th><th>Table</th><th>Column</th><th>Check</th><th>Rule</th><th>On failure</th><th class="r">Pass rate</th><th class="r">Failed</th><th>Last run</th><th>State</th><th></th></tr></thead><tbody>
    ${rules.map(r=>`<tr><td><label class="switch"><input type="checkbox" id="q-on-${r.id}" ${r.on!==false?'checked':''} data-change="ruleSet" data-id="${r.id}" data-f="on" aria-label="Run this check"><i></i></label></td><td class="mono">${esc(r.table)}</td><td class="mono">${esc(r.column)}</td><td>${esc(r.type.replace(/_/g,' '))}<div class="muted small">${DIM[r.type]||''}</div></td><td class="muted" style="max-width:260px;overflow-wrap:break-word">${esc(r.param)}</td>
      <td><select id="sev-${r.id}" data-change="ruleSet" data-id="${r.id}" data-f="severity" aria-label="On failure">${ACTIONS.map(([k,l])=>`<option value="${k}" ${r.severity===k?'selected':''}>${l}</option>`).join('')}</select></td>

function ctl(p){if(!p.ctl)p.ctl={onNewColumn:'accept',onEmpty:'skip',dedup:true,mask:true,breaker:5,gate:true,alertFail:true,alertWarn:true,alertSla:true,alertOk:false,email:true,chat:false,pager:false};return p.ctl}
function pipeRules(p,layer){return S.rules.filter(r=>p.writes.includes(r.table)&&(!layer||r.table.startsWith(layer+'.')))}
function gateTask(p,layer,type){const lt=p.tasks.filter(t=>t.layer===layer);if(type==='load'||(layer==='silver'&&type==='castable'))return lt[0]||p.tasks[0];return p.tasks.find(t=>t.id==='dq_'+layer)||lt[lt.length-1]||p.tasks[p.tasks.length-1]}
function channels(c){return [c.email&&'email',c.chat&&'chat',c.pager&&'pager'].filter(Boolean)}

/* Work out, from the current controls, what a run does when it meets a given kind of data. The run engine follows this plan. */
function predict(p,sid){
  const c=ctl(p),sc=SCN[sid]||SCN.clean,rows=((lastRun(p.id)||{rows:{}}).rows.bronze)||1000;
  const o={sid,steps:[],final:'success',warn:false,undetected:0,leak:0,failTask:null,failMsg:'',failLayer:null,quar:0,quarTask:null,badRows:0,badTable:null,hits:[],alerts:[],volFactor:1,skipAfter:null,na:false};
  const has=l=>p.writes.some(w=>w.startsWith(l+'.'));
  const say=(layer,level,text,type)=>o.steps.push({layer,level,text,task:gateTask(p,layer,type).id});
  const fail=(layer,msg,type)=>{o.final='failed';o.failLayer=layer;o.failTask=gateTask(p,layer,type).id;o.failMsg=msg};
  const judge=(layer,types,pct,bad)=>{const rs=pipeRules(p,layer).filter(r=>r.on!==false&&types.includes(r.type));if(!rs.length)return {res:'none'};
    const hit=rs.filter(r=>pct>100-(r.min==null?100:r.min)+1e-9);if(!hit.length)return {res:'within'};
    hit.forEach(r=>o.hits.push({id:r.id,pass:+(100-pct).toFixed(2),failed:bad,checked:Math.max(1,Math.round(rows))}));
    const top=hit.slice().sort((a,b)=>ACTION_RANK[b.severity]-ACTION_RANK[a.severity])[0];return {res:top.severity,rule:top}};
  if(sc.layer&&!has(sc.layer))o.na=true;
  for(const layer of LAYERS){if(!has(layer))continue;
    const L=cap(layer),n=pipeRules(p,layer).filter(r=>r.on!==false).length,active=!o.na&&sc.layer===layer,cn=n===1?'1 '+L+' check runs and passes.':n+' '+L+' checks run and pass.';
    if(o.final==='failed'){say(layer,'hold',`${L} does not run. It is held until the cause is fixed and the run is retried.`,'load');continue}
    if(o.final==='skipped'){say(layer,'hold',`${L} is skipped. There is nothing new to process.`,'load');continue}
    if(layer==='bronze'){
      if(active&&sid==='empty'){
        if(c.onEmpty==='skip'){o.final='skipped';o.volFactor=0;o.skipAfter=gateTask(p,layer,'load').id;say(layer,'ok','The source is empty. The run ends here and no table is changed.','load');continue}
        if(c.onEmpty==='fail'){fail(layer,'the source delivered no rows, and this pipeline is set to fail on an empty source','load');say(layer,'bad','The source is empty, and this pipeline is set to fail when that happens.','load');continue}
        o.volFactor=0;const j=judge(layer,['row_count'],100,0);
        if(j.res==='fail'){fail(layer,'Bronze received 0 rows, below the row count check');say(layer,'bad','Bronze lands 0 rows. The row count check stops the pipeline.');continue}
        o.warn=true;if(j.res==='none'||j.res==='within'){o.undetected=1;say(layer,'warn','Bronze lands 0 rows and no enabled check objects. Silver and Gold run on nothing new and nobody is told.')}
        else{o.alerts.push('The source was empty');say(layer,'warn','Bronze lands 0 rows. The row count check raises a warning and the run continues.')}
        continue}
      if(active&&sid==='new_column'){
        if(c.onNewColumn==='stop'){fail(layer,'a new column appeared in the source, and this pipeline is set to stop on schema changes','load');say(layer,'bad','A new column appears, and this pipeline is set to stop on schema changes. Nothing is loaded.','load');continue}
        say(layer,'ok',c.onNewColumn==='accept'?'Bronze adds the new column and lands every row. Silver ignores the column until you map it.':'Bronze lands every row and keeps the unexpected values in a side column, so nothing is lost.','load');
        const j=judge(layer,['schema'],100,0);
        if(j.res==='fail'){fail(layer,'the schema no longer matches the source contract');say(layer,'bad','The schema check stops the pipeline because the contract changed.');continue}
        o.warn=true;if(j.res==='none'||j.res==='within'){o.undetected=1;say(layer,'warn','No enabled schema check reports the change, so nobody is told about the new column.')}
        else{o.alerts.push('Schema drift: a new column appeared');say(layer,'warn','The schema check raises a schema drift warning and the run continues.')}
        continue}
      if(active&&sid==='volume_drop'){
        o.volFactor=0.4;say(layer,'ok',`Bronze lands ${num(rows*0.4)} rows, 60% fewer than usual.`,'load');
        const j=judge(layer,['volume_anomaly'],100,0);
        if(j.res==='fail'){fail(layer,'row volume fell 60% below the 7 day average');say(layer,'bad','The volume check stops the pipeline before the thin data reaches Silver.');continue}
        o.warn=true;if(j.res==='none'||j.res==='within'){o.undetected=1;say(layer,'warn','No enabled volume check notices. Reports will quietly show lower numbers.')}
        else{o.alerts.push('Volume fell 60% below the 7 day average');say(layer,'warn','The volume check raises a warning and the run continues with the rows it has.')}
        continue}
      say(layer,'ok',`Bronze lands about ${num(rows)} rows unchanged and adds lineage columns.`,'load');say(layer,'ok',n?cn:'No Bronze checks are switched on.');continue}
    if(layer==='silver'){
      if(active){
        const bad=Math.max(1,Math.round(rows*o.volFactor*sc.pct/100)),ty=sc.types[0];o.badTable=p.writes.find(w=>w.startsWith('silver.'));
        if(sid==='dup_keys'&&c.dedup){say(layer,'ok',`Deduplication keeps the newest row for each key and removes ${num(bad)} duplicates, so the unique check passes.`,'load');say(layer,'ok','The remaining rows are cast, validated and merged.');continue}
        const j=judge(layer,sc.types,sc.pct,bad);
        if(j.res==='none'){o.undetected=bad;o.leak=bad;o.warn=true;say(layer,'warn',`No enabled check looks for ${sc.what}. ${num(bad)} bad rows are merged into Silver and flow on to Gold.`,ty);continue}
        if(j.res==='within'){o.leak=bad;say(layer,'ok',`${num(bad)} rows have ${sc.what} (${sc.pct}%). That is inside the threshold you allow, so the check passes and the rows stay in Silver.`,ty);continue}
        const nm=`${j.rule.type.replace(/_/g,' ')} check on ${j.rule.column}`,gt=j.rule.type;
        if(j.res==='fail'){o.badRows=bad;fail(layer,`${num(bad)} rows have ${sc.what} (${sc.pct}%)`,gt);say(layer,'bad',`The ${nm} finds ${num(bad)} rows with ${sc.what} and stops the pipeline. The bad rows are saved to quarantine with the reason.`,gt);continue}
        if(j.res==='quarantine'){
          if(sc.pct>c.breaker){o.badRows=bad;fail(layer,`${sc.pct}% of rows would be quarantined, above the ${c.breaker}% limit`,gt);say(layer,'bad',`The ${nm} would quarantine ${num(bad)} rows (${sc.pct}%). That is above your ${c.breaker}% limit, so the run stops instead of loading a partial table.`,gt);continue}
          o.quar=bad;o.quarTask=gateTask(p,layer,gt).id;o.warn=true;o.alerts.push(`${num(bad)} rows quarantined from ${o.badTable}`);
          say(layer,'warn',`The ${nm} moves ${num(bad)} rows with ${sc.what} to quarantine. The other rows are merged into Silver.`,gt);continue}
        o.warn=true;o.leak=bad;o.alerts.push(`${num(bad)} rows with ${sc.what} in ${o.badTable}`);say(layer,'warn',`The ${nm} warns about ${num(bad)} rows with ${sc.what}. They stay in Silver.`,gt);continue}
      say(layer,'ok',`Silver casts types${c.dedup?', removes duplicates':''}${c.mask?', masks personal data':''} and merges the rows.`,'load');say(layer,'ok',n?cn:'No Silver checks are switched on.');continue}
    if(active&&sid==='gold_mismatch'){
      const j=judge(layer,['reconciliation'],sc.pct,1);
      if(j.res==='fail'){fail(layer,`Gold totals differ from Silver by ${sc.pct}%`);say(layer,'bad',c.gate?`The reconciliation check finds Gold ${sc.pct}% away from Silver and stops the run. Gold is not published, so dashboards keep the previous version.`:`The reconciliation check finds Gold ${sc.pct}% away from Silver and stops the run. Publishing does not wait for checks here, so dashboards already show the wrong numbers.`);continue}
      o.warn=true;if(j.res==='none'){o.undetected=1;say(layer,'warn',`No enabled reconciliation check compares Gold with Silver. Gold is published ${sc.pct}% off and nobody is told.`)}
      else if(j.res==='within'){o.warn=false;say(layer,'ok',`Gold is ${sc.pct}% away from Silver, inside the tolerance you allow. It is published.`)}
      else{o.alerts.push(`Gold totals differ from Silver by ${sc.pct}%`);say(layer,'warn',`The reconciliation check warns that Gold is ${sc.pct}% away from Silver. Gold is published anyway.`)}
      continue}
    say(layer,'ok',`Gold rebuilds the business tables${o.leak?', including the '+num(o.leak)+' rows that were let through':''}.`,'load');
    say(layer,'ok',n?`${cn} ${c.gate?'Gold is published.':'Gold was already published before the checks ran.'}`:'No Gold checks are switched on. Gold is published.');
  }
  return o;
}
function outcome(o){return o.na?['queued','Does not apply']:o.final==='failed'?['fail','Stops at '+cap(o.failLayer)]:o.final==='skipped'?['queued','Ends early, nothing changed']:o.undetected?['fail','Bad data gets through']:o.warn?['warn','Succeeds with warnings']:['pass','Succeeds']}
function alertLine(p,o){const c=ctl(p),ch=channels(c).join(', ');
  if(o.final==='failed')return c.alertFail&&ch?`An alert goes to ${ch}.`:'Alerting on failure is off, so nobody is told.';
  if(o.undetected)return 'No alert is sent, because nothing noticed.';
  if(o.alerts.length)return c.alertWarn&&ch?`A warning goes to ${ch}.`:'Warnings are not sent anywhere, so this is only visible in the logs.';
  return c.alertOk&&ch?`A success notice goes to ${ch}.`:'No alert is needed.'}

function genControls(p){const c=ctl(p),y=v=>v?'true':'false';
  const checks=l=>{const rs=pipeRules(p,l);return rs.length?'  checks:\n'+rs.map(r=>`    - table: ${r.table}\n      column: "${r.column}"\n      type: ${r.type}${r.param?`\n      rule: "${r.param.replace(/\\/g,'\\\\').replace(/"/g,'\\"')}"`:''}\n      pass_at_least: ${r.min==null?100:r.min}%\n      on_failure: ${r.severity}\n      enabled: ${y(r.on!==false)}`).join('\n')+'\n':'  checks: []\n'};
  const has=l=>p.writes.some(w=>w.startsWith(l+'.'));
  return `# controls/${p.id}.yml
# What this pipeline does at each step, and what happens when a check fails.
pipeline: ${p.id}

run:
  retries: ${p.retries}
  stop_if_quarantine_above: ${c.breaker}%
  alerts:
    on_failure: ${y(c.alertFail)}
    on_warning: ${y(c.alertWarn)}
    on_missed_freshness: ${y(c.alertSla)}
    on_success: ${y(c.alertOk)}
    channels: [${channels(c).join(', ')}]
${has('bronze')?`
bronze:
  on_new_column: ${c.onNewColumn}
  on_empty_source: ${c.onEmpty}
${checks('bronze')}`:''}${has('silver')?`
silver:
  deduplicate: ${y(c.dedup)}
  mask_personal_data: ${y(c.mask)}
${checks('silver')}`:''}${has('gold')?`
gold:
  publish_only_after_checks: ${y(c.gate)}
${checks('gold')}`:''}`}

function ctlLayer(p,layer){
  const c=ctl(p),rs=pipeRules(p,layer);if(!p.writes.some(w=>w.startsWith(layer+'.')))return '';
  const sel=(k,label,opts,hint)=>`<label class="field"><span>${label}</span><select id="ctl-${k}" data-change="ctlSet" data-k="${k}">${opts.map(([v,l])=>`<option value="${v}" ${c[k]===v?'selected':''}>${l}</option>`).join('')}</select>${hint?`<small>${hint}</small>`:''}</label>`;
  const sw=(k,label)=>`<label class="check"><span class="switch"><input type="checkbox" id="ctl-${k}" data-change="ctlSet" data-k="${k}" ${c[k]?'checked':''}><i></i></span>${label}</label>`;
  const beh=layer==='bronze'?`<div class="form-grid">${sel('onNewColumn','When a new column appears',[['accept','Accept it and add the column'],['rescue','Keep it in a side column'],['stop','Stop the pipeline']])}${sel('onEmpty','When the source is empty',[['skip','End the run and change nothing'],['continue','Continue with no rows'],['fail','Fail the run']])}</div>`
    :layer==='silver'?`<div style="display:flex;gap:10px 22px;flex-wrap:wrap">${sw('dedup','Remove duplicates, newest row per key wins')}${sw('mask','Mask personal data')}</div>`
    :`<div>${sw('gate','Publish Gold only after its checks pass')}</div>`;
  return `<div class="panel"><header>${disc(layer)}<h2>${cap(layer)}</h2><span class="muted small" id="ctl-count-${layer}">${rs.filter(r=>r.on!==false).length} of ${rs.length} checks on</span><button class="btn sm" data-act="ctlRecommend" data-layer="${layer}">Add recommended</button><button class="btn sm" data-act="dqAdd" data-pid="${p.id}" data-layer="${layer}">Add check</button></header>
    <div class="body">${beh}</div>
    <div class="scroll-x" style="border-top:1px solid var(--line)"><table class="tbl"><thead><tr><th>On</th><th>Check</th><th>Pass at least</th><th>If it fails</th><th></th></tr></thead><tbody>
    ${rs.map(r=>`<tr><td><label class="switch"><input type="checkbox" id="rule-on-${r.id}" ${r.on!==false?'checked':''} data-change="ruleSet" data-id="${r.id}" data-f="on" aria-label="Run this check"><i></i></label></td>
      <td><b>${esc(r.type.replace(/_/g,' '))}</b><div class="mono small">${esc(r.table.split('.')[1])}.${esc(r.column)}</div><div class="small muted" style="min-width:150px;max-width:300px">${esc(r.param||(r.type==='not_null'?'never empty':r.type==='unique'?'no repeats':''))}</div></td>
      <td><span style="display:flex;align-items:center;gap:4px"><input type="number" id="rule-min-${r.id}" min="0" max="100" step="0.1" value="${r.min==null?100:r.min}" data-change="ruleSet" data-id="${r.id}" data-f="min" aria-label="Pass at least, percent" style="min-width:70px;width:70px">%</span></td>
      <td><select id="rule-sev-${r.id}" style="min-width:176px" data-change="ruleSet" data-id="${r.id}" data-f="severity" aria-label="If it fails">${ACTIONS.map(([k,l])=>`<option value="${k}" ${r.severity===k?'selected':''}>${l}</option>`).join('')}</select></td>
      <td class="r"><button class="btn sm" data-act="dqDel" data-id="${r.id}" aria-label="Remove check">Remove</button></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No checks on ${cap(layer)} yet. Select Add recommended to start with the usual ones.</td></tr>`}
    </tbody></table></div></div>`;
}
function ctlPlan(p){
  const sid=SCN[S.ui.ctlScn]?S.ui.ctlScn:'clean',o=predict(p,sid),oc=outcome(o);
  const lv={ok:['pass','OK'],warn:['warn','Warning'],bad:['fail','Stops'],hold:['queued','Held']};
  return `<div class="panel"><header><h2>What would happen</h2>${st(oc[0],oc[1])}</header>
    <div class="body" style="display:flex;flex-direction:column;gap:8px"><label class="field"><span>If the next run meets</span><select id="ctl-scn" data-change="ctlScn">${Object.keys(SCN).map(k=>`<option value="${k}" ${k===sid?'selected':''}>${SCN[k].name}</option>`).join('')}</select><small>${SCN[sid].desc}</small></label></div>
    <div style="border-top:1px solid var(--line)">${o.na?`<div class="empty">This pipeline has no ${cap(SCN[sid].layer)} step, so this case cannot happen here.</div>`:o.steps.map(s=>`<div class="plan-step ${s.level}">${disc(s.layer)}<div class="grow">${esc(s.text)}</div>${st(lv[s.level][0],lv[s.level][1])}</div>`).join('')}</div>
    <div class="body" style="border-top:1px solid var(--line)"><div><b>Alerting.</b> ${o.na?'Nothing to report.':alertLine(p,o)}</div>
      <p class="muted small" style="margin-top:8px">A forecast worked out from these settings, with example row counts. Real runs follow the same rules and report what they actually found.</p></div></div>
  <div class="panel"><header><h2>Coverage</h2><span class="muted small">Every case, with the current controls</span></header><table class="tbl"><tbody>${Object.keys(SCN).map(k=>{const x=outcome(predict(p,k));return `<tr class="click${k===sid?' sel':''}" tabindex="0" data-act="ctlPick" data-k="${k}"><td>${SCN[k].name}</td><td class="r">${st(x[0],x[1])}</td></tr>`}).join('')}</tbody></table></div>`;
}
function ctlRun(p){const c=ctl(p),av=S.settings.channels||{},sw=(k,label,note)=>`<label class="check"><input type="checkbox" id="ctl-${k}" data-change="ctlSet" data-k="${k}" ${c[k]?'checked':''}> ${label}${note?` <span class="muted small">${note}</span>`:''}</label>`;
  return `<div class="panel"><header><h2>Run behaviour</h2></header><div class="body" style="display:flex;flex-direction:column;gap:14px">
    <div class="form-grid"><label class="field"><span>Retries per task</span><input type="number" id="ctl-retries" min="0" max="5" value="${p.retries}" data-change="ctlSet" data-k="retries"><small>A retry helps with outages. A failed check is never retried, because bad data does not fix itself.</small></label>
      <label class="field"><span>Stop the run if quarantine exceeds</span><span style="display:flex;align-items:center;gap:6px"><input type="number" id="ctl-breaker" min="0" max="100" step="0.5" value="${c.breaker}" data-change="ctlSet" data-k="breaker">%</span><small>Prevents loading a table that is mostly missing.</small></label></div>
    <div><div class="small muted" style="font-weight:600;margin-bottom:6px">Send an alert</div><div style="display:flex;gap:8px 20px;flex-wrap:wrap">${sw('alertFail','When a run fails')}${sw('alertWarn','When a check warns or quarantines')}${sw('alertSla','When Gold is late')}${sw('alertOk','When a run succeeds')}</div></div>
    <div><div class="small muted" style="font-weight:600;margin-bottom:6px">Send it to</div><div style="display:flex;gap:8px 20px;flex-wrap:wrap">${sw('email','Email',av.email?'':'(not set up on the service)')}${sw('chat','Team chat',av.chat?'':'(not set up on the service)')}${sw('pager','On-call pager',av.pager?'':'(not set up on the service)')}</div>
      <p class="muted small" style="margin-top:6px">Every alert is also kept on the Overview. A channel delivers once its address is set on the service: ALERT_WEBHOOK_URL, PAGER_WEBHOOK_URL, or the SMTP settings.</p></div>
  </div></div>`}
VIEWS.controls={nav:'Controls',render(){
  const pipes=scopedPipes();let p=pipe(S.ui.orchPid);if(!p||!inScope(p.platform)){p=pipes[0];S.ui.orchPid=p?p.id:null}

  return head('Controls','Decide what a pipeline does at every step: which checks run, how strict each one is, and what happens when one fails. Every run follows these settings.',
    `<button class="btn" data-act="ctlYaml">View as file</button><button class="btn" data-act="openPipe" data-id="${p.id}">Open pipeline</button>`)+
  `<div class="panel"><header><label class="field" style="flex-direction:row;align-items:center;gap:8px"><span>Pipeline</span><select id="ctl-pipe" data-change="orchPipe">${pipes.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>${plat(p.platform)}<span class="muted small">${esc(p.mode)}, ${cronText(p.cron).toLowerCase()}</span></header></div>
  <div class="cols wide-left"><div style="display:flex;flex-direction:column;gap:18px;min-width:0">${LAYERS.map(l=>ctlLayer(p,l)).join('')}${ctlRun(p)}</div>
    <div id="ctl-plan" class="ctl-side">${ctlPlan(p)}</div></div>`;
}};
function ctlRefresh(){const p=pipe(S.ui.orchPid);if(!p||S.view!=='controls')return;const el=$('#ctl-plan');if(el)el.innerHTML=ctlPlan(p);
  LAYERS.forEach(l=>{const e=$('#ctl-count-'+l);if(e){const rs=pipeRules(p,l);e.textContent=`${rs.filter(r=>r.on!==false).length} of ${rs.length} checks on`}})}
/* a control changes locally at once, so the forecast updates, and is saved to the service in the background */
function saveQuiet(fn){fn().then(()=>{LAST=''},e=>{toast(e.message,'bad');sync(true)})}
CHG.ctlScn=v=>{S.ui.ctlScn=v;ctlRefresh()};
ACT.ctlPick=d=>{S.ui.ctlScn=d.k;ctlRefresh()};
CHG.ctlSet=(v,d)=>{const p=pipe(S.ui.orchPid),c=ctl(p),k=d.k;
  if(k==='retries'){p.retries=Math.max(0,Math.min(5,Math.round(+v)||0));v=p.retries}else if(k==='breaker'){c.breaker=Math.max(0,Math.min(100,+v||0));v=c.breaker}else c[k]=v;
  saveQuiet(()=>api('PUT',`/api/pipelines/${p.id}/controls`,{key:k,value:v}));ctlRefresh();
  if(k==='alertFail'&&!v)toast('Failures of this pipeline will no longer alert anyone','warn');if(k==='gate'&&!v)toast('Gold will be published before its checks run','warn');
  if(['email','chat','pager'].includes(k)&&v&&!(S.settings.channels||{})[k])toast('That channel is not set up on the service yet, so nothing will be delivered to it','warn')};
CHG.ruleSet=(v,d)=>{const r=S.rules.find(x=>x.id===d.id);if(!r)return;const body={};
  if(d.f==='on'){r.on=!!v;body.on=r.on}else if(d.f==='min'){r.min=Math.max(0,Math.min(100,+v||0));body.min=r.min}else{r.severity=v;body.severity=v}
  saveQuiet(()=>api('PUT',`/api/rules/${r.id}`,body));if(S.view==='controls')ctlRefresh();else rerender()};
ACT.ctlYaml=()=>{const p=pipe(S.ui.orchPid);openDrawer('Controls as a file',`<p class="muted">The same settings as a file you can keep in a repository, so a change to them is reviewed like code.</p>${codeBlock(`controls/${p.id}.yml`,genControls(p))}`)};
ACT.ctlRecommend=d=>act(()=>api('POST',`/api/pipelines/${S.ui.orchPid}/recommend`,{layer:d.layer}),r=>r.added?`${r.added} recommended ${cap(d.layer)} checks added`:`${cap(d.layer)} already has the recommended checks`);

const ABBR={bq:'BQ',gcs:'GCS',adb:'DBX',adls:'ADLS',local:'SQL',folder:'DIR'};

VIEWS.connections={nav:'Connections',render(){
  const cs=S.connections.filter(c=>inScope(c.cloud));

  if(tab==='pii'){const rows=Object.entries(S.mappings).filter(([id])=>tabs.some(t=>t.id===id)).flatMap(([id,m])=>m.rows.map((r,i)=>[id,r,i]));const e=S.ui.erase;

    <p class="muted small" style="padding:8px 14px">A hashed column is stored as a SHA-256 value in Silver and everything built from it. Bronze keeps the original, so limit who can read Bronze. A change applies from the next run; use Full reload to rewrite rows already in Silver. Hashing is skipped while the pipeline's "Mask personal data" control is off.</p>

      ${e&&e.tables?`<div style="margin-top:10px">${e.tables.length?`<table class="tbl"><tbody>${e.tables.map(x=>`<tr><td class="mono">${esc(x.table)}</td><td class="r num">${num(x.rows)} row${x.rows===1?'':'s'}</td></tr>`).join('')}</tbody></table>${e.done?'<p style="margin-top:8px">'+st('pass','Deleted')+'</p>':e.tables.some(x=>x.rows)?`<div style="margin-top:8px"><button class="btn danger" data-act="eraseConfirm">Delete these rows</button></div>`:'<p class="muted" style="margin-top:8px">No rows match.</p>'}`:'<p class="muted">No built Silver or Gold table has a column with that name.</p>'}</div>`:''}</div>`}
  if(tab==='secrets'){const c=remote('secrets:'+S.connections.map(x=>x.id+x.secret).join(),()=>api('GET','/api/governance/secrets'));
    body=remoteHtml(c,d=>`<div class="scroll-x"><table class="tbl"><thead><tr><th>Secret name</th><th>Used by</th><th>Found in</th></tr></thead><tbody>${d.secrets.map(s=>`<tr><td class="mono">${esc(s.name)}</td><td class="mono">${esc(s.used)}</td><td>${st(s.found==='missing'?'fail':'pass',s.found==='missing'?'Not found':cap(s.found))}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No connection uses a secret. BigQuery and Cloud Storage sign in as the service account of this service.</td></tr>'}</tbody></table></div>`)+
      `<p class="muted small" style="padding:10px 14px">Only names appear here. A value is read from an environment variable of that name or from Google Secret Manager at the moment it is needed, and is never stored or shown.</p>`}
  if(tab==='audit')body=`<div class="scroll-x"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead><tbody>${S.audit.map(a=>`<tr><td class="num" style="white-space:nowrap">${stamp(a.ts)}</td><td>${esc(a.who)}</td><td><b>${esc(a.action)}</b></td><td class="mono">${esc(a.target)}</td><td class="muted">${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nothing has happened yet.</td></tr>'}</tbody></table></div>`;
  return head('Governance','Who can read each layer, how personal data is protected, where secrets live, and a record of every change.')+
  `<div class="panel"><div class="tabs" role="tablist">${[['access','Access'],['pii','Personal data'],['secrets','Secrets'],['audit','Audit log']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-act="govTab" data-tab="${k}">${l}</button>`).join('')}</div>${body}</div>`;
}};
