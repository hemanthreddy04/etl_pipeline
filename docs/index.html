}
function lineageGraph(){
  const tabs=S.tables.filter(t=>inScope(t.platform));const ids=new Set(tabs.map(t=>t.id));
  const cols=[['Sources','source',S.sources.filter(s=>tabs.some(t=>t.up.includes(s.id))).map(s=>({id:s.id,name:s.name,up:[]}))],
    ['Bronze','bronze',tabs.filter(t=>t.layer==='bronze')],['Silver','silver',tabs.filter(t=>t.layer==='silver')],['Gold','gold',tabs.filter(t=>t.layer==='gold')],
    ['Consumers','consumer',CONSUMERS.filter(c=>c.up.some(u=>ids.has(u)))]];
  const NW=168,NH=30,GX=40,GY=12,rowsMax=Math.max(...cols.map(c=>c[2].length),1),W=12+cols.length*(NW+GX)-GX+12,H=34+rowsMax*(NH+GY)+6,pos={},all=[];
  cols.forEach(([h,layer,items],i)=>items.forEach((it,j)=>{pos[it.id]={x:12+i*(NW+GX),y:34+j*(NH+GY)};all.push({...it,layer:layer,label:it.name||it.id})}));
  // selection: everything upstream and downstream of the chosen node stays lit
  const sel=S.ui.lineageSel&&pos[S.ui.lineageSel]?S.ui.lineageSel:null,lit=new Set();
  if(sel){const upOf=id=>(all.find(a=>a.id===id)||{up:[]}).up||[];const walkUp=id=>{lit.add(id);upOf(id).forEach(u=>{if(!lit.has(u))walkUp(u)})};const down=new Set();const walkDown=id=>{down.add(id);all.filter(a=>(a.up||[]).includes(id)&&!down.has(a.id)).forEach(a=>walkDown(a.id))};walkUp(sel);walkDown(sel);down.forEach(d=>lit.add(d))}
  const edges=all.flatMap(a=>(a.up||[]).filter(u=>pos[u]).map(u=>{const s=pos[u],e=pos[a.id],x1=s.x+NW,y1=s.y+NH/2,x2=e.x,y2=e.y+NH/2,mx=(x1+x2)/2;const dim=sel&&!(lit.has(u)&&lit.has(a.id));return `<path class="edge${dim?' dim':''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`})).join('');
  const heads=cols.map(([h],i)=>`<text class="colhead" x="${12+i*(NW+GX)}" y="20">${h}</text>`).join('');
  const nodes=all.map(a=>{const q=pos[a.id],lab=a.label.length>22?a.label.slice(0,21)+'…':a.label;return `<g class="node${sel===a.id?' sel':''}${sel&&!lit.has(a.id)?' dim':''}" tabindex="0" role="button" data-act="lineageSel" data-id="${esc(a.id)}" aria-label="${esc(a.label)}"><rect x="${q.x}" y="${q.y}" width="${NW}" height="${NH}" rx="4"/><circle class="l-${a.layer}" cx="${q.x+12}" cy="${q.y+NH/2}" r="4.5"/><text x="${q.x+23}" y="${q.y+19}">${esc(lab)}</text></g>`}).join('');
  return `<div class="graph scroll-x"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lineage from sources through Bronze, Silver and Gold to consumers">${heads}${edges}${nodes}</svg></div>`;
}

  <div class="panel"><header><h2>Tables</h2><span class="muted small">${tabs.length} in scope, ${fmt(tabs.reduce((a,t)=>a+t.rows,0))} rows</span></header><div class="scroll-x"><table class="tbl"><thead><tr><th>Table</th><th>Engine</th><th class="r">Rows</th><th>Last written</th><th>Load pattern</th></tr></thead><tbody>

const TX=['trim','lower','upper','initcap','cast','digits only'];
function mapRows(id){const d=S.ui.mapDraft;return d&&d.id===id?d.rows:S.mappings[id].rows}
function mapDraft(id){if(!S.ui.mapDraft||S.ui.mapDraft.id!==id)S.ui.mapDraft={id,rows:JSON.parse(JSON.stringify(S.mappings[id].rows))};return S.ui.mapDraft.rows}
VIEWS.mappings={nav:'Mappings',render(){
  const ids=Object.keys(S.mappings).filter(id=>{const t=tbl(id);return t&&inScope(t.platform)});let id=S.ui.mapTable;if(!ids.includes(id)){id=ids[0];S.ui.mapTable=id}

  `<div class="panel"><header><label class="field" style="flex-direction:row;align-items:center;gap:8px"><span>Target table</span><select id="map-table" data-change="mapTable">${ids.map(x=>`<option ${x===id?'selected':''}>${esc(x)}</option>`).join('')}</select></label><span class="muted small">Source: <span class="mono">${esc(m.source)}</span></span>${plat(t.platform)}${dirty?st('pending','Unsaved changes'):''}</header>
  <div class="scroll-x"><table class="tbl"><thead><tr><th>Source column</th><th>Target column</th><th>Target type</th><th>Transformation</th><th>Required</th><th>Hash</th><th></th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td><input type="text" id="map-${i}-src" class="mono" value="${esc(r.src)}" data-change="mapEdit" data-i="${i}" data-f="src" aria-label="Source column"></td>
    <td><input type="text" id="map-${i}-tgt" class="mono" value="${esc(r.tgt)}" data-change="mapEdit" data-i="${i}" data-f="tgt" aria-label="Target column"></td>

    <td><input type="text" id="map-${i}-tx" class="mono" list="tx-list" value="${esc(r.tx)}" data-change="mapEdit" data-i="${i}" data-f="tx" aria-label="Transformation"></td>

  </tbody></table></div><datalist id="tx-list">${TX.map(x=>`<option value="${x}">`).join('')}</datalist></div>

  <p class="muted small">Transformations take a preset (${TX.join(', ')}) or any SQL expression over the Bronze columns, for example <code>on_hand - reserved</code>. A saved mapping applies from the next run. Use Full reload on the pipeline to apply it to rows that are already in Silver. Marking a column required adds a not-null check for it.</p>`;
}};
function mapErrors(id){const rows=mapRows(id),m=S.mappings[id],src=tbl(m.source),errs=[],seen={};

  return errs}

    <div class="panel"><header><h2>${STEPS[b.step]}</h2><span class="muted small">Step ${b.step+1} of ${STEPS.length}</span></header><div class="body" style="display:flex;flex-direction:column;gap:14px">${builderStep(b)}
      <div style="display:flex;gap:8px;justify-content:space-between"><button class="btn" data-act="bStep" data-i="${b.step-1}" ${b.step===0?'disabled':''}>Back</button>${b.step<STEPS.length-1?`<button class="btn primary" data-act="bStep" data-i="${b.step+1}">Next: ${STEPS[b.step+1]}</button>`:''}</div></div></div>
    <div id="codepane" style="display:flex;flex-direction:column;gap:8px;min-width:0">${builderCode()}</div>
  </div>`;
}};
const STEP_TAB=['bronze','bronze','silver','gold'];
ACT.bStep=d=>{const b=S.builder,i=Math.max(0,Math.min(STEPS.length-1,+d.i));b.step=i;if(STEP_TAB[i]&&!['spark','orch'].includes(b.tab))b.tab=STEP_TAB[i];render();$('#content').scrollTop=0};
ACT.bTab=d=>{S.builder.tab=d.tab;$('#codepane').innerHTML=builderCode()};
function bSet(v,d){const b=S.builder,k=d.k;if(k.startsWith('gold.'))b.gold[k.slice(5)]=v;else b[k]=v;return k}
INP.bf=(v,d)=>{const k=bSet(v,d);planFetch();if(k==='cron'){const t=$('#b-cron-text'),nx=nextRuns(v,1);if(t)t.textContent=cronText(v)+(nx.length?'. Next: '+stamp(nx[0]):'')}};
CHG.bf=(v,d)=>{const b=S.builder,k=bSet(v,d);if(k==='target'||k==='kind'){const cs=builderConns(b);b.conn=cs[0]?cs[0].id:'';if(targetType(b)==='local'&&!['csv','json'].includes(b.format))b.format='csv'}rerender()};

ACT.bBrowse=()=>{const b=S.builder;openDrawer('Files in the source folder','<div class="empty">Listing files</div>');api('POST','/api/files',{connection:b.conn,path:b.path,format:b.format}).then(r=>{
  $('#drawer-body').innerHTML=r.files.length?`<p class="muted">${r.total} ${b.format.toUpperCase()} file${r.total===1?'':'s'} under this folder${r.total>r.files.length?', showing the first '+r.files.length:''}.</p><div class="scroll-x"><table class="tbl"><thead><tr><th>File</th><th class="r">Size</th><th>Modified</th></tr></thead><tbody>${r.files.map(f=>`<tr><td class="mono">${esc(f.name)}</td><td class="r num">${fmt(f.size)} B</td><td class="num">${f.modified?stamp(f.modified):''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No ${b.format.toUpperCase()} files were found under this folder.</div>`},e=>{$('#drawer-body').innerHTML=`<div class="banner">${esc(e.message)}</div>`})};
ACT.bDeploy=async d=>{const b=S.builder;try{const p=await api('POST','/api/pipelines',{cfg:builderCfg(b)});S.builder=null;S.ui.plan=null;S.ui.orchPid=p.id;if(d.run)await api('POST',`/api/pipelines/${p.id}/run`,{});await sync(true);go('orchestration');toast(d.run?`${p.id} deployed and its first run has started`:`${p.id} deployed. Select Run now to load it.`)}catch(e){toast(e.message,'bad')}};
/* ---------- Controls: what each pipeline does, and what happens when a check fails ---------- */
const LAYERS=['bronze','silver','gold'];
const ACTION_RANK={fail:3,quarantine:2,warn:1};
const ACTIONS=[['fail','Stop the pipeline'],['quarantine','Quarantine the rows'],['warn','Warn and continue']];
const SCN={
 clean:{name:'Clean data',desc:'Every row is valid. This is the normal path.'},
 bad_cast:{name:'Values that cannot be cast',layer:'silver',types:['castable'],pct:0.3,what:'values that cannot be cast to their type',desc:'A few rows carry text where a number or date is expected, such as "12,90".'},
 null_keys:{name:'Missing business keys',layer:'silver',types:['not_null'],pct:0.5,what:'an empty business key',desc:'Some rows arrive without the key that identifies them.'},
 dup_keys:{name:'Duplicate keys',layer:'silver',types:['unique'],pct:1.2,what:'a key that appears more than once',desc:'The source sends the same record twice.'},
 out_of_range:{name:'Values outside the allowed range',layer:'silver',types:['range','accepted_values','regex'],pct:2,what:'values outside the allowed range or list',desc:'Negative amounts, unknown status codes or malformed emails.'},
 flood:{name:'A large share of bad rows',layer:'silver',types:['castable'],pct:8,what:'values that cannot be cast to their type',desc:'8% of the rows are broken, usually because the source changed its format.'},
 new_column:{name:'A new column appears',layer:'bronze',types:['schema'],desc:'The source adds a column nobody announced.'},
 empty:{name:'Nothing new in the source',layer:'bronze',types:['row_count'],desc:'No new file arrived, or the source table has no rows past the watermark.'},
 volume_drop:{name:'Volume drops by 60%',layer:'bronze',types:['volume_anomaly'],desc:'Far fewer rows than usual, with nothing visibly wrong. The volume check needs three earlier runs to compare with.'},
 gold_mismatch:{name:'Gold totals do not match Silver',layer:'gold',types:['reconciliation'],pct:1.8,desc:'A join in the Gold model drops or doubles rows.'}
};
function ctl(p){if(!p.ctl)p.ctl={onNewColumn:'accept',onEmpty:'skip',dedup:true,mask:true,breaker:5,gate:true,alertFail:true,alertWarn:true,alertSla:true,alertOk:false,email:true,chat:false,pager:false};return p.ctl}
function pipeRules(p,layer){return S.rules.filter(r=>p.writes.includes(r.table)&&(!layer||r.table.startsWith(layer+'.')))}
function gateTask(p,layer,type){const lt=p.tasks.filter(t=>t.layer===layer);if(type==='load'||(layer==='silver'&&type==='castable'))return lt[0]||p.tasks[0];return p.tasks.find(t=>t.id==='dq_'+layer)||lt[lt.length-1]||p.tasks[p.tasks.length-1]}
function channels(c){return [c.email&&'email',c.chat&&'chat',c.pager&&'pager'].filter(Boolean)}

/* Work out, from the current controls, what a run does when it meets a given kind of data. The run engine follows this plan. */
function predict(p,sid){
  const c=ctl(p),sc=SCN[sid]||SCN.clean,rows=((lastRun(p.id)||{rows:{}}).rows.bronze)||1000;
  const o={sid,steps:[],final:'success',warn:false,undetected:0,leak:0,failTask:null,failMsg:'',failLayer:null,quar:0,quarTask:null,badRows:0,badTable:null,hits:[],alerts:[],volFactor:1,skipAfter:null,na:false};
  const has=l=>p.writes.some(w=>w.startsWith(l+'.'));
  const say=(layer,level,text,type)=>o.steps.push({layer,level,text,task:gateTask(p,layer,type).id});
  const fail=(layer,msg,type)=>{o.final='failed';o.failLayer=layer;o.failTask=gateTask(p,layer,type).id;o.failMsg=msg};
  const judge=(layer,types,pct,bad)=>{const rs=pipeRules(p,layer).filter(r=>r.on!==false&&types.includes(r.type));if(!rs.length)return {res:'none'};
    const hit=rs.filter(r=>pct>100-(r.min==null?100:r.min)+1e-9);if(!hit.length)return {res:'within'};
    hit.forEach(r=>o.hits.push({id:r.id,pass:+(100-pct).toFixed(2),failed:bad,checked:Math.max(1,Math.round(rows))}));
    const top=hit.slice().sort((a,b)=>ACTION_RANK[b.severity]-ACTION_RANK[a.severity])[0];return {res:top.severity,rule:top}};
  if(sc.layer&&!has(sc.layer))o.na=true;
  for(const layer of LAYERS){if(!has(layer))continue;
    const L=cap(layer),n=pipeRules(p,layer).filter(r=>r.on!==false).length,active=!o.na&&sc.layer===layer,cn=n===1?'1 '+L+' check runs and passes.':n+' '+L+' checks run and pass.';
    if(o.final==='failed'){say(layer,'hold',`${L} does not run. It is held until the cause is fixed and the run is retried.`,'load');continue}
    if(o.final==='skipped'){say(layer,'hold',`${L} is skipped. There is nothing new to process.`,'load');continue}
    if(layer==='bronze'){
      if(active&&sid==='empty'){
        if(c.onEmpty==='skip'){o.final='skipped';o.volFactor=0;o.skipAfter=gateTask(p,layer,'load').id;say(layer,'ok','The source is empty. The run ends here and no table is changed.','load');continue}
        if(c.onEmpty==='fail'){fail(layer,'the source delivered no rows, and this pipeline is set to fail on an empty source','load');say(layer,'bad','The source is empty, and this pipeline is set to fail when that happens.','load');continue}
        o.volFactor=0;const j=judge(layer,['row_count'],100,0);
        if(j.res==='fail'){fail(layer,'Bronze received 0 rows, below the row count check');say(layer,'bad','Bronze lands 0 rows. The row count check stops the pipeline.');continue}
        o.warn=true;if(j.res==='none'||j.res==='within'){o.undetected=1;say(layer,'warn','Bronze lands 0 rows and no enabled check objects. Silver and Gold run on nothing new and nobody is told.')}
        else{o.alerts.push('The source was empty');say(layer,'warn','Bronze lands 0 rows. The row count check raises a warning and the run continues.')}
        continue}
      if(active&&sid==='new_column'){
        if(c.onNewColumn==='stop'){fail(layer,'a new column appeared in the source, and this pipeline is set to stop on schema changes','load');say(layer,'bad','A new column appears, and this pipeline is set to stop on schema changes. Nothing is loaded.','load');continue}
        say(layer,'ok',c.onNewColumn==='accept'?'Bronze adds the new column and lands every row. Silver ignores the column until you map it.':'Bronze lands every row and keeps the unexpected values in a side column, so nothing is lost.','load');
        const j=judge(layer,['schema'],100,0);
        if(j.res==='fail'){fail(layer,'the schema no longer matches the source contract');say(layer,'bad','The schema check stops the pipeline because the contract changed.');continue}
        o.warn=true;if(j.res==='none'||j.res==='within'){o.undetected=1;say(layer,'warn','No enabled schema check reports the change, so nobody is told about the new column.')}
        else{o.alerts.push('Schema drift: a new column appeared');say(layer,'warn','The schema check raises a schema drift warning and the run continues.')}
        continue}
      if(active&&sid==='volume_drop'){
        o.volFactor=0.4;say(layer,'ok',`Bronze lands ${num(rows*0.4)} rows, 60% fewer than usual.`,'load');
        const j=judge(layer,['volume_anomaly'],100,0);
        if(j.res==='fail'){fail(layer,'row volume fell 60% below the 7 day average');say(layer,'bad','The volume check stops the pipeline before the thin data reaches Silver.');continue}
        o.warn=true;if(j.res==='none'||j.res==='within'){o.undetected=1;say(layer,'warn','No enabled volume check notices. Reports will quietly show lower numbers.')}
        else{o.alerts.push('Volume fell 60% below the 7 day average');say(layer,'warn','The volume check raises a warning and the run continues with the rows it has.')}
        continue}
      say(layer,'ok',`Bronze lands about ${num(rows)} rows unchanged and adds lineage columns.`,'load');say(layer,'ok',n?cn:'No Bronze checks are switched on.');continue}
    if(layer==='silver'){
      if(active){
        const bad=Math.max(1,Math.round(rows*o.volFactor*sc.pct/100)),ty=sc.types[0];o.badTable=p.writes.find(w=>w.startsWith('silver.'));
        if(sid==='dup_keys'&&c.dedup){say(layer,'ok',`Deduplication keeps the newest row for each key and removes ${num(bad)} duplicates, so the unique check passes.`,'load');say(layer,'ok','The remaining rows are cast, validated and merged.');continue}
        const j=judge(layer,sc.types,sc.pct,bad);
        if(j.res==='none'){o.undetected=bad;o.leak=bad;o.warn=true;say(layer,'warn',`No enabled check looks for ${sc.what}. ${num(bad)} bad rows are merged into Silver and flow on to Gold.`,ty);continue}
        if(j.res==='within'){o.leak=bad;say(layer,'ok',`${num(bad)} rows have ${sc.what} (${sc.pct}%). That is inside the threshold you allow, so the check passes and the rows stay in Silver.`,ty);continue}
        const nm=`${j.rule.type.replace(/_/g,' ')} check on ${j.rule.column}`,gt=j.rule.type;
        if(j.res==='fail'){o.badRows=bad;fail(layer,`${num(bad)} rows have ${sc.what} (${sc.pct}%)`,gt);say(layer,'bad',`The ${nm} finds ${num(bad)} rows with ${sc.what} and stops the pipeline. The bad rows are saved to quarantine with the reason.`,gt);continue}
        if(j.res==='quarantine'){
          if(sc.pct>c.breaker){o.badRows=bad;fail(layer,`${sc.pct}% of rows would be quarantined, above the ${c.breaker}% limit`,gt);say(layer,'bad',`The ${nm} would quarantine ${num(bad)} rows (${sc.pct}%). That is above your ${c.breaker}% limit, so the run stops instead of loading a partial table.`,gt);continue}
          o.quar=bad;o.quarTask=gateTask(p,layer,gt).id;o.warn=true;o.alerts.push(`${num(bad)} rows quarantined from ${o.badTable}`);
          say(layer,'warn',`The ${nm} moves ${num(bad)} rows with ${sc.what} to quarantine. The other rows are merged into Silver.`,gt);continue}
        o.warn=true;o.leak=bad;o.alerts.push(`${num(bad)} rows with ${sc.what} in ${o.badTable}`);say(layer,'warn',`The ${nm} warns about ${num(bad)} rows with ${sc.what}. They stay in Silver.`,gt);continue}
      say(layer,'ok',`Silver casts types${c.dedup?', removes duplicates':''}${c.mask?', masks personal data':''} and merges the rows.`,'load');say(layer,'ok',n?cn:'No Silver checks are switched on.');continue}
    if(active&&sid==='gold_mismatch'){
      const j=judge(layer,['reconciliation'],sc.pct,1);
      if(j.res==='fail'){fail(layer,`Gold totals differ from Silver by ${sc.pct}%`);say(layer,'bad',c.gate?`The reconciliation check finds Gold ${sc.pct}% away from Silver and stops the run. Gold is not published, so dashboards keep the previous version.`:`The reconciliation check finds Gold ${sc.pct}% away from Silver and stops the run. Publishing does not wait for checks here, so dashboards already show the wrong numbers.`);continue}
      o.warn=true;if(j.res==='none'){o.undetected=1;say(layer,'warn',`No enabled reconciliation check compares Gold with Silver. Gold is published ${sc.pct}% off and nobody is told.`)}
      else if(j.res==='within'){o.warn=false;say(layer,'ok',`Gold is ${sc.pct}% away from Silver, inside the tolerance you allow. It is published.`)}
      else{o.alerts.push(`Gold totals differ from Silver by ${sc.pct}%`);say(layer,'warn',`The reconciliation check warns that Gold is ${sc.pct}% away from Silver. Gold is published anyway.`)}
      continue}
    say(layer,'ok',`Gold rebuilds the business tables${o.leak?', including the '+num(o.leak)+' rows that were let through':''}.`,'load');
    say(layer,'ok',n?`${cn} ${c.gate?'Gold is published.':'Gold was already published before the checks ran.'}`:'No Gold checks are switched on. Gold is published.');
  }
  return o;
}
function outcome(o){return o.na?['queued','Does not apply']:o.final==='failed'?['fail','Stops at '+cap(o.failLayer)]:o.final==='skipped'?['queued','Ends early, nothing changed']:o.undetected?['fail','Bad data gets through']:o.warn?['warn','Succeeds with warnings']:['pass','Succeeds']}
function alertLine(p,o){const c=ctl(p),ch=channels(c).join(', ');
  if(o.final==='failed')return c.alertFail&&ch?`An alert goes to ${ch}.`:'Alerting on failure is off, so nobody is told.';
  if(o.undetected)return 'No alert is sent, because nothing noticed.';
  if(o.alerts.length)return c.alertWarn&&ch?`A warning goes to ${ch}.`:'Warnings are not sent anywhere, so this is only visible in the logs.';
  return c.alertOk&&ch?`A success notice goes to ${ch}.`:'No alert is needed.'}

function genControls(p){const c=ctl(p),y=v=>v?'true':'false';
  const checks=l=>{const rs=pipeRules(p,l);return rs.length?'  checks:\n'+rs.map(r=>`    - table: ${r.table}\n      column: "${r.column}"\n      type: ${r.type}${r.param?`\n      rule: "${r.param.replace(/\\/g,'\\\\').replace(/"/g,'\\"')}"`:''}\n      pass_at_least: ${r.min==null?100:r.min}%\n      on_failure: ${r.severity}\n      enabled: ${y(r.on!==false)}`).join('\n')+'\n':'  checks: []\n'};
  const has=l=>p.writes.some(w=>w.startsWith(l+'.'));
  return `# controls/${p.id}.yml
# What this pipeline does at each step, and what happens when a check fails.
pipeline: ${p.id}

run:
  retries: ${p.retries}
  stop_if_quarantine_above: ${c.breaker}%
  alerts:
    on_failure: ${y(c.alertFail)}
    on_warning: ${y(c.alertWarn)}
    on_missed_freshness: ${y(c.alertSla)}
    on_success: ${y(c.alertOk)}
    channels: [${channels(c).join(', ')}]
${has('bronze')?`
bronze:
  on_new_column: ${c.onNewColumn}
  on_empty_source: ${c.onEmpty}
${checks('bronze')}`:''}${has('silver')?`
silver:
  deduplicate: ${y(c.dedup)}
  mask_personal_data: ${y(c.mask)}
${checks('silver')}`:''}${has('gold')?`
gold:
  publish_only_after_checks: ${y(c.gate)}
${checks('gold')}`:''}`}

function ctlLayer(p,layer){
  const c=ctl(p),rs=pipeRules(p,layer);if(!p.writes.some(w=>w.startsWith(layer+'.')))return '';
  const sel=(k,label,opts,hint)=>`<label class="field"><span>${label}</span><select id="ctl-${k}" data-change="ctlSet" data-k="${k}">${opts.map(([v,l])=>`<option value="${v}" ${c[k]===v?'selected':''}>${l}</option>`).join('')}</select>${hint?`<small>${hint}</small>`:''}</label>`;
  const sw=(k,label)=>`<label class="check"><span class="switch"><input type="checkbox" id="ctl-${k}" data-change="ctlSet" data-k="${k}" ${c[k]?'checked':''}><i></i></span>${label}</label>`;
  const beh=layer==='bronze'?`<div class="form-grid">${sel('onNewColumn','When a new column appears',[['accept','Accept it and add the column'],['rescue','Keep it in a side column'],['stop','Stop the pipeline']])}${sel('onEmpty','When the source is empty',[['skip','End the run and change nothing'],['continue','Continue with no rows'],['fail','Fail the run']])}</div>`
    :layer==='silver'?`<div style="display:flex;gap:10px 22px;flex-wrap:wrap">${sw('dedup','Remove duplicates, newest row per key wins')}${sw('mask','Mask personal data')}</div>`
    :`<div>${sw('gate','Publish Gold only after its checks pass')}</div>`;
  return `<div class="panel"><header>${disc(layer)}<h2>${cap(layer)}</h2><span class="muted small" id="ctl-count-${layer}">${rs.filter(r=>r.on!==false).length} of ${rs.length} checks on</span><button class="btn sm" data-act="ctlRecommend" data-layer="${layer}">Add recommended</button><button class="btn sm" data-act="dqAdd" data-pid="${p.id}" data-layer="${layer}">Add check</button></header>
    <div class="body">${beh}</div>
    <div class="scroll-x" style="border-top:1px solid var(--line)"><table class="tbl"><thead><tr><th>On</th><th>Check</th><th>Pass at least</th><th>If it fails</th><th></th></tr></thead><tbody>
    ${rs.map(r=>`<tr><td><label class="switch"><input type="checkbox" id="rule-on-${r.id}" ${r.on!==false?'checked':''} data-change="ruleSet" data-id="${r.id}" data-f="on" aria-label="Run this check"><i></i></label></td>
      <td><b>${esc(r.type.replace(/_/g,' '))}</b><div class="mono small">${esc(r.table.split('.')[1])}.${esc(r.column)}</div><div class="small muted" style="min-width:150px;max-width:300px">${esc(r.param||(r.type==='not_null'?'never empty':r.type==='unique'?'no repeats':''))}</div></td>
      <td><span style="display:flex;align-items:center;gap:4px"><input type="number" id="rule-min-${r.id}" min="0" max="100" step="0.1" value="${r.min==null?100:r.min}" data-change="ruleSet" data-id="${r.id}" data-f="min" aria-label="Pass at least, percent" style="min-width:70px;width:70px">%</span></td>
      <td><select id="rule-sev-${r.id}" style="min-width:176px" data-change="ruleSet" data-id="${r.id}" data-f="severity" aria-label="If it fails">${ACTIONS.map(([k,l])=>`<option value="${k}" ${r.severity===k?'selected':''}>${l}</option>`).join('')}</select></td>
      <td class="r"><button class="btn sm" data-act="dqDel" data-id="${r.id}" aria-label="Remove check">Remove</button></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No checks on ${cap(layer)} yet. Select Add recommended to start with the usual ones.</td></tr>`}
    </tbody></table></div></div>`;
}
function ctlPlan(p){
  const sid=SCN[S.ui.ctlScn]?S.ui.ctlScn:'clean',o=predict(p,sid),oc=outcome(o);
  const lv={ok:['pass','OK'],warn:['warn','Warning'],bad:['fail','Stops'],hold:['queued','Held']};
  return `<div class="panel"><header><h2>What would happen</h2>${st(oc[0],oc[1])}</header>
    <div class="body" style="display:flex;flex-direction:column;gap:8px"><label class="field"><span>If the next run meets</span><select id="ctl-scn" data-change="ctlScn">${Object.keys(SCN).map(k=>`<option value="${k}" ${k===sid?'selected':''}>${SCN[k].name}</option>`).join('')}</select><small>${SCN[sid].desc}</small></label></div>
    <div style="border-top:1px solid var(--line)">${o.na?`<div class="empty">This pipeline has no ${cap(SCN[sid].layer)} step, so this case cannot happen here.</div>`:o.steps.map(s=>`<div class="plan-step ${s.level}">${disc(s.layer)}<div class="grow">${esc(s.text)}</div>${st(lv[s.level][0],lv[s.level][1])}</div>`).join('')}</div>
    <div class="body" style="border-top:1px solid var(--line)"><div><b>Alerting.</b> ${o.na?'Nothing to report.':alertLine(p,o)}</div>
      <p class="muted small" style="margin-top:8px">A forecast worked out from these settings, with example row counts. Real runs follow the same rules and report what they actually found.</p></div></div>
  <div class="panel"><header><h2>Coverage</h2><span class="muted small">Every case, with the current controls</span></header><table class="tbl"><tbody>${Object.keys(SCN).map(k=>{const x=outcome(predict(p,k));return `<tr class="click${k===sid?' sel':''}" tabindex="0" data-act="ctlPick" data-k="${k}"><td>${SCN[k].name}</td><td class="r">${st(x[0],x[1])}</td></tr>`}).join('')}</tbody></table></div>`;
}
function ctlRun(p){const c=ctl(p),av=S.settings.channels||{},sw=(k,label,note)=>`<label class="check"><input type="checkbox" id="ctl-${k}" data-change="ctlSet" data-k="${k}" ${c[k]?'checked':''}> ${label}${note?` <span class="muted small">${note}</span>`:''}</label>`;
  return `<div class="panel"><header><h2>Run behaviour</h2></header><div class="body" style="display:flex;flex-direction:column;gap:14px">

  const pipes=scopedPipes();
  return head('Code export','Take every pipeline out as files: the SQL each run executes, the controls, and Spark and orchestration code for teams that prefer to run it themselves.',pipes.length?`<button class="btn primary" data-act="exportZip">Show every file</button>`:'')+
  `<div class="banner info"><div>The SQL files are exactly what this service runs. The Spark, Airflow and Databricks Workflows files are generated from the same definitions as a starting point, and this service does not run or test them.</div></div>
  <div class="panel"><div class="scroll-x"><table class="tbl"><thead><tr><th>Pipeline</th><th>Engine</th><th>Files</th><th></th></tr></thead><tbody>${pipes.map(p=>{let fs=[];try{fs=pipelineFiles(p)}catch(e){}return `<tr><td><b>${esc(p.name)}</b></td><td>${plat(p.platform)}</td><td class="mono small">sql/${esc(p.id)}/bronze.sql, silver.sql, gold.sql<br>${fs.map(f=>esc(f[0])).join('<br>')}</td><td class="r"><button class="btn sm" data-act="openSql" data-id="${p.id}">View SQL</button></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">Nothing to export until a pipeline exists.</td></tr>'}</tbody></table></div></div>
  <div class="cols split">
    <div class="panel"><header><h2>Suggested repository layout</h2></header><div class="body scroll-x"><pre class="tree">${esc(REPO_TREE)}</pre></div></div>
    <div class="panel"><header><h2>Keeping it under review</h2></header><div class="body"><p>Commit the export to a repository so that a change to a mapping, a check or a control shows up as a diff someone can review. The <span class="mono">controls/</span> files record what each pipeline does when a check fails.</p><p style="margin-top:8px" class="muted">Every change made on this site is also in the audit log, with who made it and when.</p></div></div>
  </div>`;
}};
const REPO_TREE=`medallion-pipelines/
├── sql/
│   └── <pipeline>/        bronze.sql, silver.sql, gold.sql as the service runs them
├── controls/              what each pipeline does when a check fails
├── quality/               checks per table
├── pipelines/
│   ├── bronze/            Spark version of each Bronze load
│   └── silver/            Spark version of each Silver transform
├── dags/ or workflows/    orchestration definitions
└── README.md`;
ACT.exportZip=async(d,el)=>{el.disabled=true;try{const files=[];
  for(const p of scopedPipes()){const pl=await api('POST','/api/plan',{pipeline:p.id});['bronze','silver','gold'].forEach(k=>files.push({path:`sql/${p.id}/${k}.sql`,content:pl[k]}));try{pipelineFiles(p).forEach(f=>files.push({path:f[0],content:f[1]}))}catch(e){}}
  openDrawer('Exported files',`<p class="muted" style="margin-bottom:10px">${files.length} files. A page inside Claude cannot save files to your device, so copy the ones you need. The deployed service downloads the same files as one zip.</p><div style="display:flex;flex-direction:column;gap:10px">${files.map(f=>codeBlock(f.path,f.content)).join('')}</div>`)}catch(e){toast(e.message,'bad')}el.disabled=false};

/* ---------- Concepts ---------- */
const CONCEPTS=[
 ['Medallion architecture','Architecture','A lakehouse pattern with three layers of rising quality. Bronze keeps raw data, Silver keeps clean and conformed data, Gold keeps business-ready tables.','overview'],
 ['Lakehouse','Architecture','Cheap object storage with a table format on top, giving warehouse features such as transactions, schemas and SQL directly on files.','overview'],
 ['Data lake and data warehouse','Architecture','A lake stores any file cheaply and applies structure when read. A warehouse stores modelled tables and enforces structure when written.','overview'],
 ['ETL and ELT','Architecture','ETL transforms data before loading it. ELT loads raw data first and transforms it inside the platform, which is what the medallion layers do.','builder'],
 ['Batch and streaming','Architecture','Batch processes data in scheduled chunks. Streaming processes records continuously as they arrive, usually in small micro-batches.','pipelines'],
 ['Lambda and Kappa','Architecture','Lambda runs separate batch and streaming paths and merges them. Kappa treats everything as a stream and replays it when logic changes.','pipelines'],
 ['Data mesh','Architecture','Domain teams own and publish their data as products, on a shared platform with shared governance.','lineage'],
 ['Full and incremental load','Ingestion','A full load rereads everything each run. An incremental load reads only what changed, which is cheaper but needs a reliable way to detect change.','builder'],
 ['Change data capture','Ingestion','Reading inserts, updates and deletes from a database log or change table, so the lake can follow the source without rescanning it.','builder'],
 ['Watermark','Ingestion','In batch, the highest value already loaded, such as the latest updated_at. In streaming, how long to wait for late events before closing a window.','builder'],
 ['Auto Loader','Ingestion','A Databricks file source that tracks which files it has already read and loads only new ones, with schema inference and evolution.','builder'],
 ['Checkpoint','Ingestion','Saved progress of a stream, such as offsets and state. After a restart the job resumes exactly where it stopped.','builder'],
 ['Idempotency','Ingestion','Running the same load twice gives the same result as running it once. It is what makes retries and backfills safe.','orchestration'],
 ['Exactly-once processing','Ingestion','Each record affects the result once, even after failures. In practice it comes from replayable sources, checkpoints and idempotent writes.','builder'],
 ['Backfill','Ingestion','Rerunning a pipeline for past dates, to load history or repair a period after a fix.','orchestration'],
 ['Schema evolution','Ingestion','Handling new, removed or retyped source columns without breaking the load. Bronze accepts changes and Silver decides what to do with them.','bronze'],
 ['Schema on read and schema on write','Ingestion','Schema on read stores data as it comes and interprets it when queried, as in Bronze. Schema on write validates before storing, as in Silver.','bronze'],
 ['Late-arriving data','Ingestion','Records that show up after their time period was already processed. Handled with watermarks, merges and by rebuilding recent partitions.','silver'],
 ['Dead-letter queue','Ingestion','A side destination for messages that could not be processed, so one bad record does not block the stream.','quality'],
 ['Parquet','Storage','A columnar file format. It compresses well and lets engines read only the columns and row groups a query needs.','bronze'],
 ['Delta Lake','Storage','A table format that adds a transaction log to Parquet files, giving ACID writes, MERGE, schema enforcement and time travel.','silver'],
 ['Apache Iceberg','Storage','An open table format with snapshots, hidden partitioning and schema evolution, readable by many engines.','silver'],
 ['ACID transactions','Storage','Writes are all-or-nothing and isolated, so readers never see a half-written table.','silver'],
 ['Partitioning','Storage','Splitting a table into folders by a column such as date, so queries that filter on it skip most files.','bronze'],
 ['Clustering and Z-ordering','Storage','Sorting data within files by frequently filtered columns, so the engine can skip files using their min and max statistics.','silver'],
 ['Small file problem','Storage','Many tiny files make reads slow because of listing and open overhead. Compaction merges them into fewer, larger files.','silver'],
 ['Compaction and OPTIMIZE','Storage','Rewriting many small files into fewer large ones. In Delta this is the OPTIMIZE command.','silver'],
 ['Vacuum','Storage','Deleting data files that no table version references any more. It frees storage and shortens how far back time travel can go.','silver'],
 ['Time travel','Storage','Querying or restoring a table as it was at an earlier version or time.','gold'],
 ['Type casting','Transformation','Converting text to proper types. A safe cast returns NULL instead of failing, so bad rows can be isolated instead of crashing the job.','mappings'],
 ['Deduplication','Transformation','Keeping one row per business key, usually the newest, using a window function such as ROW_NUMBER.','silver'],
 ['MERGE and upsert','Transformation','One statement that updates rows that match a key and inserts those that do not.','silver'],
 ['SCD Type 1','Transformation','A slowly changing dimension where an update overwrites the old value. No history is kept.','silver'],
 ['SCD Type 2','Transformation','A slowly changing dimension that keeps history. Each change closes the current row and adds a new one with validity dates.','silver'],
 ['Surrogate key','Transformation','A generated key that stands in for the business key, stable across source systems and across versions of a row.','gold'],
 ['Source to target mapping','Transformation','A table that states, column by column, where each target value comes from and how it is transformed.','mappings'],
 ['Sessionization','Transformation','Grouping a user\'s events into sessions, usually by closing a session after a period of inactivity.','silver'],
 ['Window functions','Transformation','Calculations across related rows, such as ranking, running totals or the previous value, without collapsing them.','silver'],
 ['Shuffle','Transformation','Moving rows between Spark executors so matching keys end up together for joins and aggregations. It is usually the costly part of a job.','compute'],
 ['Data skew','Transformation','A few keys hold most of the rows, so a few tasks do most of the work. Fixed with salting, broadcast joins or adaptive execution.','compute'],
 ['Broadcast join','Transformation','Sending a small table to every executor so a large table can be joined without a shuffle.','compute'],
 ['Fact table','Modelling','Measurements of events, such as sales or page views, at a declared grain, with keys to dimensions.','gold'],
 ['Dimension table','Modelling','Descriptive context for facts, such as customer, product or date.','gold'],
 ['Grain','Modelling','What one row of a table represents. Stating it first prevents double counting.','gold'],
 ['Star schema','Modelling','A fact table in the centre joined directly to dimension tables. Simple for people and fast for engines.','gold'],
 ['Conformed dimension','Modelling','One shared dimension used by many facts, so numbers agree across reports.','gold'],
 ['Data Vault','Modelling','A modelling style of hubs, links and satellites, built for auditability and for adding sources without rework.','gold'],
 ['One big table','Modelling','A wide, denormalised table that joins everything in advance. Convenient for BI tools at the cost of storage and flexibility.','gold'],
 ['Aggregate table','Modelling','A precomputed summary, such as daily totals, so dashboards do not scan detail rows.','gold'],
 ['Data quality dimensions','Quality','Completeness, uniqueness, validity, consistency, timeliness and accuracy. Each check measures one of them.','quality'],
 ['Expectation','Quality','A rule the data must satisfy, such as not null, unique or within a range, checked on every run.','quality'],
 ['Quarantine','Quality','Setting bad rows aside with the reason, so good rows continue and the bad ones can be fixed and replayed.','quality'],
 ['Quality gate','Quality','A point in a pipeline where checks must pass before data moves on or is published.','controls'],
 ['Check severity','Quality','What a failing check does: stop the pipeline, move the bad rows to quarantine, or only warn.','controls'],
 ['Circuit breaker','Quality','A limit that stops a run when too many rows fail, so a mostly empty table is never loaded.','controls'],
 ['Data contract','Quality','An agreement between a producer and its consumers about schema, meaning and quality, enforced by tests.','cicd'],
 ['Reconciliation','Quality','Comparing counts or totals between layers, or with the source, to prove nothing was lost or doubled.','quality'],
 ['Freshness','Quality','How recently a table was updated, compared with how recent it is expected to be.','monitoring'],
 ['Anomaly detection','Quality','Flagging a volume or value that falls outside its usual pattern, such as half the normal rows.','quality'],
 ['DAG','Orchestration','A directed acyclic graph: tasks and their dependencies, with no cycles. It decides what runs after what.','orchestration'],
 ['Scheduling and cron','Orchestration','Starting pipelines on a timetable. A cron expression has five fields: minute, hour, day of month, month and day of week.','orchestration'],
 ['Sensor','Orchestration','A task that waits for something outside the pipeline, such as a file arriving or an upstream table being ready.','orchestration'],
 ['Retries and backoff','Orchestration','Rerunning a failed task automatically, waiting longer each time, to ride out temporary faults.','orchestration'],
 ['Catch-up','Orchestration','Whether the scheduler creates runs for intervals it missed while a pipeline was paused.','orchestration'],
 ['SLA','Orchestration','An agreed deadline or freshness target. Missing it raises an alert even if nothing failed.','monitoring'],
 ['Observability','Operations','Being able to tell what the pipelines are doing from the outside, through metrics, logs, lineage and data checks.','monitoring'],
 ['Lineage','Operations','The path data takes from source to consumer, at table or column level. It powers impact analysis and root-cause tracing.','lineage'],
 ['Autoscaling','Operations','Adding and removing workers as load changes, to finish on time without paying for idle machines.','compute'],
 ['Job cluster and all-purpose cluster','Operations','A job cluster starts for one run and stops afterwards. An all-purpose cluster stays up for interactive work and costs more per hour.','compute'],
 ['Serverless compute','Operations','Compute the platform starts and scales for you, billed only while it works.','compute'],
 ['FinOps','Operations','Managing cloud spend as an engineering concern: tagging, right-sizing, auto-stop and watching cost per pipeline.','monitoring'],
 ['Data catalog','Governance','A searchable inventory of tables, columns, owners and tags. Unity Catalog and Dataplex are examples.','lineage'],
 ['Role-based access control','Governance','Granting permissions to groups by role, not to individuals, with the least privilege each role needs.','governance'],
 ['Personal data masking','Governance','Hiding or transforming personal data, by hashing, redacting or partially showing it, depending on who is reading.','governance'],
 ['Secrets management','Governance','Keeping credentials in a vault and referring to them by name, so they never appear in code, configuration or logs.','governance'],
 ['Managed identity and workload identity','Governance','Letting a job authenticate as itself to cloud services, with no stored key to leak or rotate.','connections'],
 ['Right to erasure','Governance','Deleting a person\'s data on request across every layer, including old file versions.','governance'],
 ['Audit log','Governance','A record of who did what and when, for security reviews and compliance.','governance'],
 ['Retention policy','Governance','How long each table and its history are kept before being deleted.','governance'],
 ['CI/CD','Delivery','Testing every change automatically and deploying it through environments in a repeatable way.','cicd'],
 ['Infrastructure as code','Delivery','Defining storage, catalogs, clusters and permissions in versioned files, with tools such as Terraform or asset bundles.','cicd'],
 ['Environments','Delivery','Separate dev, test and prod copies of the platform, so changes are proven before they reach real consumers.','cicd'],
 ['Unit and data tests','Delivery','Unit tests check transformation logic on tiny inputs. Data tests check real tables after a run.','cicd'],
 ['Model Context Protocol','AI','An open protocol that lets an AI agent discover and call tools on external systems in a uniform, typed way.','mcp'],
 ['Agentic pipelines','AI','Using an AI agent to design, generate and operate pipelines through tools, with a person approving the steps that change things.','agent'],
 ['Human in the loop','AI','Requiring a person to approve an agent\'s actions that write, deploy or delete.','mcp'],
 ['Self-healing pipeline','AI','A pipeline that detects a known failure, applies a safe fix such as quarantine and retry, and escalates the rest.','agent'],
 ['Synthetic data','AI','Generated data that mimics the shape and statistics of real data, for testing without exposing real records.','quality']
];
function conceptList(){const q=S.ui.conceptText.toLowerCase(),cat=S.ui.conceptCat;const ls=CONCEPTS.filter(c=>(cat==='All'||c[1]===cat)&&(!q||(c[0]+' '+c[2]).toLowerCase().includes(q)));
  return ls.map(c=>`<div class="concept"><h3>${esc(c[0])}</h3><p>${esc(c[2])}</p><div class="meta"><span class="chip">${c[1]}</span><button class="linkish" data-act="go" data-view="${c[3]}">See it in ${esc(VIEWS[c[3]].nav)}</button></div></div>`).join('')||'<div class="empty">No concept matches. Try a shorter search.</div>'}
VIEWS.concepts={nav:'Concepts',render(){
  const cats=['All',...new Set(CONCEPTS.map(c=>c[1]))];
  return head('Concepts',`${CONCEPTS.length} data engineering ideas in plain words, each linked to the screen where this control plane puts it to work.`)+
  `<div class="panel"><header><input type="search" id="concept-q" data-input="conceptText" placeholder="Search concepts" value="${esc(S.ui.conceptText)}" aria-label="Search concepts" style="flex:1 1 200px"><div class="seg" role="group" aria-label="Category">${cats.map(c=>`<button aria-pressed="${S.ui.conceptCat===c}" data-act="conceptCat" data-cat="${c}">${c}</button>`).join('')}</div></header><div id="conceptlist">${conceptList()}</div></div>`;
}};
ACT.conceptCat=d=>{S.ui.conceptCat=d.cat;render()};
INP.conceptText=v=>{S.ui.conceptText=v;$('#conceptlist').innerHTML=conceptList()};
/* ---------- global search ---------- */
INP.search=v=>{const q=v.trim().toLowerCase(),box=$('#qres');if(q.length<2){box.hidden=true;return}
  const out=[];
  Object.keys(VIEWS).forEach(id=>{if(VIEWS[id].nav.toLowerCase().includes(q))out.push(['Screen',VIEWS[id].nav,'view',id])});
  S.tables.filter(t=>t.id.toLowerCase().includes(q)||t.cols.some(c=>c.name.toLowerCase()===q)).slice(0,6).forEach(t=>out.push(['Table',t.id,'table',t.id]));
  S.pipelines.filter(p=>p.id.toLowerCase().includes(q)).forEach(p=>out.push(['Pipeline',p.id,'pipe',p.id]));
  S.connections.filter(c=>c.id.toLowerCase().includes(q)).slice(0,4).forEach(c=>out.push(['Connection',c.id,'view','connections']));
  CONCEPTS.filter(c=>c[0].toLowerCase().includes(q)).slice(0,5).forEach(c=>out.push(['Concept',c[0],'concept',c[0]]));
  box.innerHTML=out.slice(0,12).map(r=>`<button data-act="searchGo" data-kind="${r[2]}" data-id="${esc(r[3])}"><span class="k">${r[0]}</span><span>${esc(r[1])}</span></button>`).join('')||'<div class="empty">Nothing matches.</div>';box.hidden=false};
ACT.searchGo=d=>{$('#qres').hidden=true;$('#q').value='';
  if(d.kind==='view')go(d.id);else if(d.kind==='pipe'){S.ui.orchPid=d.id;go('orchestration')}
  else if(d.kind==='table'){const t=tbl(d.id);S.ui.layerTable[t.layer]=t.id;go(t.layer)}
  else if(d.kind==='concept'){S.ui.conceptCat='All';S.ui.conceptText=d.id;go('concepts')}};

/* ---------- boot: start the SQL engine, load state, then keep it fresh ---------- */
(function boot(){
  $('#q').setAttribute('data-input','search');
  const h=(location.hash||'').slice(1);S.view=VIEWS[h]?h:'overview';
  render();
  const fail=msg=>{const c=$('#live-chip');c.className='st bad';c.textContent='Not running';$('#view').innerHTML=`<div class="banner"><div>${esc(msg)}</div></div>`};
  let ls=null;try{ls=window.localStorage;ls.getItem('medallion-probe')}catch(e){ls=null}
  const start=()=>initSqlJs().then(SQL=>{
    const info=BE.init({SQL,storage:ls});
    BE.onChange=()=>{sync().catch(()=>{})};
    const loop=async()=>{
      try{await sync()}catch(e){if(!S.ready)fail('This copy could not start: '+e.message)}
      const busy=S.runs.some(r=>r.status==='running')||S.ui.testing;
      setTimeout(loop,busy?1200:6000)};
    loop();
    if(info.restored)toast('Your work from last time was restored from this browser');
    if(info.note)toast(info.note,'warn');
  },e=>fail('The SQL engine could not start: '+(e&&e.message||e)));
  if(typeof initSqlJs==='function'){start();return}
  /* the engine file next to the page did not load: try the same build from the public CDN before giving up */
  const missing='The SQL engine did not load, so this copy cannot run. Reload the page to try again.';
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-asm.js';
  s.onload=()=>{if(typeof initSqlJs==='function')start();else fail(missing)};s.onerror=()=>fail(missing);document.head.appendChild(s);
})();
</script>
</body></html>
