<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Medallion Control Plane Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a fixed left rail of grouped sections, a slim top bar that scopes platform and environment,
   one scrolling work area, and a right drawer for forms and details. The three metals carry layer identity. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --line:#D3DAE2; --fg:#16202A; --muted:#566575;
  --accent:#6B3FA0; --accent-fg:#FFFFFF; --accent-soft:#EFE8F7;
  --bronze:#AE5A24; --silver:#4A84B8; --gold:#B98A00;
  --bronze-soft:#F6E9DF; --silver-soft:#E3EDF6; --gold-soft:#F6EFD6;
  --ok:#1B7F45; --warn:#A86200; --bad:#C0362C; --ok-soft:#E0F2E7; --warn-soft:#FBEBD0; --bad-soft:#FBE3E0;
  --rail:#14212C; --rail-fg:#C5D1DB; --rail-muted:#8A9CAC; --rail-active:#243B4E; --rail-line:#263A4A;
  --code-bg:#101C26; --code-fg:#D5E0E8; --code-kw:#B79BEA; --code-str:#E3BE7C; --code-com:#8196A5; --code-num:#9FD6B0;
  --shadow:0 10px 30px rgba(16,28,38,.18);
  --font-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1820; --surface:#16242E; --surface-2:#1E303C; --line:#2B4050; --fg:#E3EBF1; --muted:#97A9B8;
    --accent:#B596EA; --accent-fg:#1A1026; --accent-soft:#2A2542;
    --bronze:#C26F36; --silver:#4A8BCB; --gold:#B08C14;
    --bronze-soft:#3A2718; --silver-soft:#1B3044; --gold-soft:#36300F;
    --ok:#4CC07C; --warn:#E0A33C; --bad:#F0736B; --ok-soft:#143524; --warn-soft:#3A2C10; --bad-soft:#3F1D1A;
    --rail:#0A1218; --rail-fg:#C5D1DB; --rail-muted:#8A9CAC; --rail-active:#1B2D3B; --rail-line:#1D2D39;
    --code-bg:#0A1319; --code-fg:#D5E0E8; --code-kw:#B79BEA; --code-str:#E3BE7C; --code-com:#8196A5; --code-num:#9FD6B0;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1820; --surface:#16242E; --surface-2:#1E303C; --line:#2B4050; --fg:#E3EBF1; --muted:#97A9B8;
  --accent:#B596EA; --accent-fg:#1A1026; --accent-soft:#2A2542;
  --bronze:#C26F36; --silver:#4A8BCB; --gold:#B08C14;
  --bronze-soft:#3A2718; --silver-soft:#1B3044; --gold-soft:#36300F;
  --ok:#4CC07C; --warn:#E0A33C; --bad:#F0736B; --ok-soft:#143524; --warn-soft:#3A2C10; --bad-soft:#3F1D1A;
  --rail:#0A1218; --rail-fg:#C5D1DB; --rail-muted:#8A9CAC; --rail-active:#1B2D3B; --rail-line:#1D2D39;
  --code-bg:#0A1319; --code-fg:#D5E0E8; --code-kw:#B79BEA; --code-str:#E3BE7C; --code-com:#8196A5; --code-num:#9FD6B0;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);overflow:hidden}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:22px;font-weight:700;line-height:1.2}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--font-mono);font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* shell */
.app{height:100%;display:grid;grid-template-columns:228px minmax(0,1fr)}
.rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--rail-line)}
.brand strong{display:block;font:700 15px/1.1 var(--font-display);color:#fff;letter-spacing:.01em}
.brand span.sub{display:block;font-size:11px;color:var(--rail-muted);text-transform:uppercase;letter-spacing:.09em}
.medals{display:flex}
.medals .disc{width:16px;height:16px;margin-right:-5px;box-shadow:0 0 0 2px var(--rail)}
.disc{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted);position:relative}
.disc::after{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid rgba(255,255,255,.55)}
.disc-bronze{background:var(--bronze)} .disc-silver{background:var(--silver)} .disc-gold{background:var(--gold)}
.disc-source,.disc-consumer{background:var(--muted)}
#nav{padding:8px 8px 12px;flex:1}
.nav-group{margin-top:10px}
.nav-group h6{margin:0;padding:6px 8px 4px;font:600 10.5px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--rail-muted)}
.nav-group a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;color:var(--rail-fg);text-decoration:none;font-size:13.5px;cursor:pointer}
.nav-group a:hover{background:var(--rail-active)}
.nav-group a[aria-current="page"]{background:var(--rail-active);color:#fff;font-weight:600}
.nav-group a .cnt{margin-left:auto;font-size:11px;color:var(--rail-muted);font-variant-numeric:tabular-nums}
.nav-group a .cnt.hot{background:var(--bad);color:#fff;border-radius:8px;padding:0 6px}
.rail-foot{padding:12px 16px;font-size:11.5px;line-height:1.4;color:var(--rail-muted);border-top:1px solid var(--rail-line)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px clamp(16px,2.4vw,28px);background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .menu{display:none}
.search{position:relative;flex:1 1 220px;min-width:0;max-width:440px}
.search input{width:100%}
#qres{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);max-height:320px;overflow:auto;padding:4px}
#qres button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:4px;cursor:pointer}
#qres button:hover,#qres button:focus-visible{background:var(--surface-2)}
#qres .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex:none;width:92px}
.scope{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.scope label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.demo-chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
.content{flex:1;overflow:auto;padding-block:20px 48px;padding-inline:clamp(16px,2.4vw,28px)}
#view{display:flex;flex-direction:column;gap:18px;max-width:1320px}

/* page head */
.ph{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.ph>div:first-child{min-width:0;flex:1 1 320px}
.ph p{color:var(--muted);max-width:68ch;margin-top:4px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;border:1px solid var(--warn);background:var(--warn-soft);font-size:13px}
.banner.info{border-color:var(--line);background:var(--surface-2)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0;max-width:100%}
textarea{font-family:var(--font-mono);font-size:12.5px;width:100%;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.field small{color:var(--muted);font-size:11.5px}
.field input,.field select{width:100%}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:6px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.switch{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch i{position:absolute;inset:0;border-radius:10px;background:var(--line);transition:background .15s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked + i{background:var(--ok)}
.switch input:checked + i::after{transform:translateX(14px)}
.switch input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}

/* panels and tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.panel>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel>header h2{margin-right:auto}
.panel>.body{padding:14px}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
.cols.wide-left{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cols.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols>*{min-width:0}
.scroll-x{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:600 11px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.num,.tbl td.nw{white-space:nowrap}
.tbl td .disc{vertical-align:-1px;margin-right:4px}
.banner>div{min-width:0;flex:1 1 220px}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover,.tbl tbody tr.sel{background:var(--surface-2)}
.tbl input,.tbl select{padding:3px 6px;font-size:12.5px;width:100%;min-width:90px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.empty{padding:22px 14px;color:var(--muted);text-align:center}

/* status and chips */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;background:var(--surface-2)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.st.ok{background:var(--ok-soft)} .st.ok::before{background:var(--ok)}
.st.bad{background:var(--bad-soft)} .st.bad::before{background:var(--bad);border-radius:1px}
.st.warn{background:var(--warn-soft)} .st.warn::before{background:var(--warn);border-radius:1px;transform:rotate(45deg)}
.st.run{background:var(--accent-soft)} .st.run::before{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.st.run::before{animation:none}*{transition:none!important}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.chip.pii{border-color:var(--bad)}
.chip.az{border-color:var(--silver)} .chip.gcp{border-color:var(--gold)}
.tags{display:flex;gap:4px;flex-wrap:wrap}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kpi .l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font:700 22px/1.2 var(--font-display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted)}

/* medallion flow */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow-step{flex:1 1 150px;min-width:0;padding:14px;background:none;border:0;text-align:left;cursor:pointer;border-radius:6px}
.flow-step:hover{background:var(--surface-2)}
.flow-step span{display:block}
.flow-step .t{display:flex;align-items:center;gap:8px;font:600 14px var(--font-display)}
.flow-step .t .disc{width:18px;height:18px}
.flow-step .n{font:700 20px/1.2 var(--font-display);font-variant-numeric:tabular-nums;margin-top:8px}
.flow-step .s{font-size:12px;color:var(--muted)}
.flow-arrow{flex:0 0 auto;align-self:center;color:var(--muted);font-size:18px;padding:0 2px}
.layer-band{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:6px;flex-wrap:wrap}
.layer-band.bronze{background:var(--bronze-soft)} .layer-band.silver{background:var(--silver-soft)} .layer-band.gold{background:var(--gold-soft)}
.layer-band .disc{width:34px;height:34px}
.layer-band .disc::after{inset:4px;border-width:2px}
.layer-band ul{margin:6px 0 0;padding-left:18px;color:var(--fg)}
.layer-band>div{flex:1 1 260px;min-width:0}

.plan-step{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line)}
.plan-step:last-child{border-bottom:0}
.plan-step .disc{margin-top:4px}
.plan-step .grow{flex:1;min-width:0}
.plan-step.hold{color:var(--muted)}
.ctl-side{display:flex;flex-direction:column;gap:18px;min-width:0;position:sticky;top:0;max-height:calc(100dvh - 110px);overflow-y:auto}
@media (max-width:860px){.ctl-side{position:static;max-height:none;overflow:visible}}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:500;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* code */
.code{background:var(--code-bg);color:var(--code-fg);border-radius:6px;overflow:hidden;min-width:0}
.code-head{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.08);font:12px var(--font-mono);color:var(--code-com)}
.code-head span{margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-head button{border:1px solid rgba(255,255,255,.2);background:none;color:var(--code-fg);border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer}
.code pre{margin:0;padding:12px 14px;overflow:auto;max-height:520px;font:12.5px/1.55 var(--font-mono);tab-size:4}
.code .kw{color:var(--code-kw)} .code .str{color:var(--code-str)} .code .com{color:var(--code-com);font-style:italic} .code .nm{color:var(--code-num)}

/* wizard */
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s}
.steps button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 12px 4px 4px;cursor:pointer;font-size:13px;font-weight:500}
.steps button::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font:600 12px var(--font-mono)}
.steps button[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.steps button[aria-current="step"]::before{background:var(--accent);color:var(--accent-fg)}
.steps button.done::before{background:var(--ok);color:#fff;content:"\2713"}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;color:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:11px var(--font-body)}
.chart text.lbl{fill:var(--fg);font-weight:600}
.chart .ring{stroke:var(--surface);stroke-width:2}
.chart .xhair{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;min-width:130px}
.tip b{display:block;margin-bottom:4px}
.tip .row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .row i{width:12px;height:2px;flex:none}
.tip .row span{color:var(--muted);margin-right:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i:not(.disc){display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.legend .disc{margin-right:6px;vertical-align:-1px}
.bars{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:8px 10px;align-items:center;font-size:13px}
.bars .track{height:14px}
.bars .bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.bars .bar.bronze{background:var(--bronze)} .bars .bar.silver{background:var(--silver)} .bars .bar.gold{background:var(--gold)}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}

/* dag + lineage */
.graph svg{display:block;color:var(--fg)}
.graph .edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.graph .node rect{fill:var(--surface);stroke:var(--line);stroke-width:1}
.graph .node{cursor:pointer}
.graph .node:hover rect,.graph .node:focus-visible rect{stroke:var(--accent)}
.graph .node.sel rect{stroke:var(--accent);stroke-width:2}
.graph .node text{fill:var(--fg);font:12px var(--font-body)}
.graph .node text.sub{fill:var(--muted);font-size:10.5px}
.graph .dim{opacity:.22}
.graph .dot-queued{fill:var(--line)} .graph .dot-running,.graph .dot-retry{fill:var(--accent)} .graph .dot-success{fill:var(--ok)} .graph .dot-failed{fill:var(--bad)} .graph .dot-upstream_failed,.graph .dot-skipped{fill:var(--warn)} .graph .dot-idle{fill:var(--muted)}
.graph .l-bronze{fill:var(--bronze)} .graph .l-silver{fill:var(--silver)} .graph .l-gold{fill:var(--gold)} .graph .l-source,.graph .l-consumer,.graph .l-ops{fill:var(--muted)}
.graph .colhead{fill:var(--muted);font:600 10.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase}
.gantt{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:6px 10px;align-items:center;font-size:12.5px}
.gantt .lane{position:relative;height:12px;background:var(--surface-2);border-radius:3px}
.gantt .lane i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--ok);min-width:3px}

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);

const fmt=n=>{n=Number(n)||0;const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(1)+'M':a>=1e4?(n/1e3).toFixed(0)+'K':a>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n))};
const num=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const usd=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const dur=s=>{s=Math.max(0,Math.round(s));return s<60?s+'s':s<3600?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m'};
const ago=ts=>{const d=Date.now()-ts;if(d<0){const f=-d;return f<HOUR?'in '+Math.max(1,Math.round(f/MIN))+' min':f<DAY?'in '+Math.round(f/HOUR)+' h':'in '+Math.round(f/DAY)+' d'}
  return d<MIN?'just now':d<HOUR?Math.round(d/MIN)+' min ago':d<DAY?Math.round(d/HOUR)+' h ago':Math.round(d/DAY)+' d ago'};
const iso=ts=>new Date(ts).toISOString();
const dstr=ts=>iso(ts).slice(0,10);
const clock=ts=>iso(ts).slice(11,19);
const stamp=ts=>iso(ts).slice(0,16).replace('T',' ')+' UTC';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- state: a cache of what the service holds ---------- */
const S={view:'overview',platform:'all',env:'dev',settings:{env:'dev',channels:{},agent:false,protected:true},
  connections:[],tables:[],pipelines:[],sources:[],runs:[],logs:[],alerts:[],rules:[],quarantine:[],audit:[],approvals:[],roles:[],mappings:{},drift:[],
  cache:{},ready:false,
  ui:{layerTable:{},orchPid:null,lineageSel:null,mapTable:null,govTab:'access',logLevel:'all',logPid:'all',logText:'',conceptCat:'All',conceptText:'',monRange:14},
  builder:null,agent:{msgs:[],busy:false,pending:false}};
const CONSUMERS=[];

/* ---------- small renderers ---------- */
const ST={success:['ok','Succeeded'],running:['run','Running'],failed:['bad','Failed'],queued:['','Queued'],retry:['run','Retrying'],upstream_failed:['warn','Upstream failed'],skipped:['','Skipped'],
  healthy:['ok','Healthy'],degraded:['warn','Degraded'],down:['bad','Unreachable'],active:['ok','Active'],paused:['warn','Paused'],pass:['ok','Pass'],warn:['warn','Warning'],fail:['bad','Fail'],
  terminated:['','Stopped'],starting:['run','Starting'],stopping:['run','Stopping'],enabled:['ok','Enabled'],disabled:['','Disabled'],idle:['','Not run yet'],testing:['run','Testing'],
  open:['bad','Open'],ack:['','Acknowledged'],pending:['warn','Pending'],deployed:['ok','Deployed']};
const st=(s,label)=>{const d=ST[s]||['',s];return `<span class="st ${d[0]}">${esc(label||d[1])}</span>`};
const plat=p=>p==='azure'?'<span class="chip az">Azure</span>':p==='gcp'?'<span class="chip gcp">GCP</span>':'<span class="chip">Local</span>';
const disc=l=>`<i class="disc disc-${l}" aria-hidden="true"></i>`;
const layerChip=l=>`<span class="chip">${disc(l)}${cap(l)}</span>`;
const head=(title,sub,actions='')=>`<div class="ph"><div><h1>${title}</h1><p>${sub}</p></div><div class="ph-act">${actions}</div></div>`;
const inScope=p=>S.platform==='all'||p===S.platform||p==='any';
const pipe=id=>S.pipelines.find(p=>p.id===id);
const tbl=id=>S.tables.find(t=>t.id===id);
const conn=id=>S.connections.find(c=>c.id===id);

/* ---------- toast, drawer, audit, log ---------- */
function toast(msg,kind='ok'){const el=document.createElement('div');el.className='toast '+(kind==='ok'?'':kind);const s=document.createElement('span');s.textContent=msg;el.appendChild(s);$('#toasts').appendChild(el);setTimeout(()=>el.remove(),4200)}
function openDrawer(title,html){$('#drawer-title').textContent=title;$('#drawer-body').innerHTML=html;$('#drawer').hidden=false;$('#scrim').hidden=false;const f=$('#drawer-body input,#drawer-body select,#drawer-body textarea,#drawer-body button');if(f)f.focus()}
function closeDrawer(){$('#drawer').hidden=true;if(!$('#rail').classList.contains('open'))$('#scrim').hidden=true;S.ui.drawerRun=null}

/* ---------- talking to the service ---------- */
function token(){try{return sessionStorage.getItem('mcp-token')||''}catch(e){return S.ui.token||''}}
function setToken(v){S.ui.token=v;try{sessionStorage.setItem('mcp-token',v)}catch(e){}}
/* in this copy the service runs inside the page: the same routes, answered by BE instead of over the network */
async function api(method,path,body){return BE.handle(method,path,body)}
/* run a change, then pull fresh state; errors become a message instead of a crash */
async function act(fn,done){try{const out=await fn();await sync(true);if(done)toast(typeof done==='function'?done(out):done);return out}catch(e){toast(e.message,'bad');return null}}
let LAST='';
async function sync(force){
  const d=await api('GET','/api/state');const sig=JSON.stringify({...d,now:0});
  if(sig===LAST&&!force&&S.ready)return false;LAST=sig;
  Object.assign(S,{settings:d.settings,env:d.settings.env,connections:d.connections,pipelines:d.pipelines,tables:d.tables,sources:d.sources,runs:d.runs,logs:d.logs,alerts:d.alerts,rules:d.rules,
    quarantine:d.quarantine,mappings:d.mappings,drift:d.drift,audit:d.audit,approvals:d.approvals,roles:d.roles,ready:true});
  $('#env-chip').textContent=S.env;refresh();if(S.ui.drawerRun&&!$('#drawer').hidden)ACT.openRun({id:S.ui.drawerRun,keep:'1'});return true}
/* data that is fetched on demand (previews, compute, tools): render "loading", fetch once, render again */
function remote(key,loader){const c=S.cache[key];if(c)return c;S.cache[key]={loading:true};
  loader().then(d=>{S.cache[key]={data:d}},e=>{S.cache[key]={error:e.message}}).finally(()=>refresh());return S.cache[key]}
function remoteHtml(c,fn){return c.loading?'<div class="empty">Loading from the service</div>':c.error?`<div class="banner">${esc(c.error)}</div>`:fn(c.data)}
function askToken(){if($('#token-form'))return;openDrawer('Access token',`<p class="muted">This control plane is protected. Enter the access token that was set when the service was deployed.</p><form data-form="saveToken" id="token-form"><label class="field"><span>Access token</span><input type="password" id="tk" name="token" autocomplete="off" required></label><div><button class="btn primary">Continue</button></div></form>`)}
function copyText(text,btn){const done=()=>{if(btn){const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1400)}};
  try{navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done))}catch(e){fallbackCopy(text,done)}}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Copy is blocked here. Select the text and copy it manually.','warn')}ta.remove()}

/* ---------- code block with light highlighting ---------- */
const KW='def|import|from|return|if|else|elif|for|in|as|with|raise|not|and|or|None|True|False|lambda|SELECT|FROM|WHERE|GROUP|BY|ORDER|AS|ON|AND|OR|NOT|NULL|IS|JOIN|LEFT|INNER|MERGE|USING|WHEN|MATCHED|THEN|UPDATE|SET|INSERT|INTO|VALUES|ROW|CREATE|REPLACE|TABLE|PARTITION|CLUSTER|ALL|CAST|CASE|END|ELSE|DISTINCT|UNION|OVER|QUALIFY|TRUE|FALSE|true|false|null';
const HL=new RegExp('(#.*$|--\\s.*$)|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')|\\b('+KW+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b','gm');
function hl(src){let out='',i=0;src.replace(HL,(m,c,s,k,n,idx)=>{out+=esc(src.slice(i,idx));out+=`<span class="${c?'com':s?'str':k?'kw':'nm'}">${esc(m)}</span>`;i=idx+m.length;return m});return out+esc(src.slice(i))}
const CODE_STORE={};
function codeBlock(file,src){const id='c'+Object.keys(CODE_STORE).length;CODE_STORE[id]=src;return `<div class="code"><div class="code-head"><span>${esc(file)}</span><button data-act="copyCode" data-id="${id}">Copy</button></div><pre tabindex="0"><code>${hl(src)}</code></pre></div>`}

/* ---------- routing and rendering ---------- */
const VIEWS={},ACT={},CHG={},INP={},FORMS={};
const NAV=[['Operate',['overview','pipelines','orchestration','monitoring']],['Layers',['bronze','silver','gold']],['Build',['builder','controls','mappings','quality']],
  ['Platform',['connections','compute','mcp','agent']],['Govern',['lineage','governance','cicd']],['Learn',['concepts']]];
FORMS.saveToken=f=>{setToken(f.token.trim());closeDrawer();sync(true).then(()=>toast('Signed in'),e=>toast(e.message,'bad'))};
function renderNav(){
  const open=S.alerts.filter(a=>!a.ack).length;
  const counts={pipelines:S.pipelines.filter(p=>inScope(p.platform)).length,connections:S.connections.filter(c=>inScope(c.cloud)).length,mcp:S.approvals.filter(a=>a.status==='pending').length||undefined,quality:S.rules.length,
    bronze:S.tables.filter(t=>t.layer==='bronze'&&inScope(t.platform)).length,silver:S.tables.filter(t=>t.layer==='silver'&&inScope(t.platform)).length,gold:S.tables.filter(t=>t.layer==='gold'&&inScope(t.platform)).length};
  $('#nav').innerHTML=NAV.map(([g,ids])=>`<div class="nav-group"><h6>${g}</h6>${ids.map(id=>{const v=VIEWS[id];const lay=['bronze','silver','gold'].includes(id)?disc(id):'';
    const c=id==='overview'&&open?`<span class="cnt hot" title="Open alerts">${open}</span>`:counts[id]!=null?`<span class="cnt">${counts[id]}</span>`:'';
    return `<a href="#${id}" data-act="go" data-view="${id}" ${S.view===id?'aria-current="page"':''}>${lay}${v.nav}${c}</a>`}).join('')}</div>`).join('');
}
function render(){for(const k in CODE_STORE)delete CODE_STORE[k];renderNav();const v=VIEWS[S.view];if(!S.ready){$('#view').innerHTML='<div class="empty">Starting the SQL engine</div>';return}$('#view').innerHTML=v.render();if(v.after)v.after()}
function rerender(){setTimeout(()=>{const a=document.activeElement,id=a&&a.id;render();const e=id&&document.getElementById(id);if(e)e.focus()},0)}
function refresh(){const a=document.activeElement;if(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;const c=$('#content'),sc=c.scrollTop;const inner=$$('#view [data-keep]').map(e=>[e.dataset.keep,e.scrollTop]);render();inner.forEach(([k,t])=>{const e=$(`#view [data-keep="${k}"]`);if(e)e.scrollTop=t});c.scrollTop=sc}
function go(view,silent){if(!VIEWS[view])view='overview';S.view=view;$('#qres').hidden=true;if(!silent){try{history.replaceState(null,'','#'+view)}catch(e){try{location.hash=view}catch(_){}}}render();$('#content').scrollTop=0;closeRail()}
function closeRail(){$('#rail').classList.remove('open');if($('#drawer').hidden)$('#scrim').hidden=true}
ACT.go=d=>go(d.view);
ACT.toggleRail=()=>{const r=$('#rail');r.classList.toggle('open');$('#scrim').hidden=!r.classList.contains('open')};
ACT.closeDrawer=()=>closeDrawer();
ACT.closeAll=()=>{$('#drawer').hidden=true;$('#rail').classList.remove('open');$('#scrim').hidden=true;S.ui.drawerRun=null};
ACT.copyCode=(d,el)=>copyText(CODE_STORE[d.id]||el.closest('.code').querySelector('code').textContent,el);
CHG.setPlatform=v=>{S.platform=v;render()};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!e.target.closest('.search'))$('#qres').hidden=true;
  if(!t)return;
  if(e.target.closest('input,select,textarea,label')&&!t.matches('input,select,textarea,label,button'))return;
  if(t.tagName==='A')e.preventDefault();
  const fn=ACT[t.dataset.act];if(fn)fn(t.dataset,t,e);
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-change]');if(t&&CHG[t.dataset.change])CHG[t.dataset.change](t.type==='checkbox'?t.checked:t.value,t.dataset,t)});
document.addEventListener('input',e=>{const t=e.target.closest('[data-input]');if(t&&INP[t.dataset.input])INP[t.dataset.input](t.value,t.dataset,t)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.closest('[data-form]');if(f&&FORMS[f.dataset.form])FORMS[f.dataset.form](Object.fromEntries(new FormData(f)),f)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ACT.closeAll();$('#qres').hidden=true;return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act]:not(button):not(a):not(input):not(select):not(textarea)')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==S.view&&VIEWS[h])go(h,true)});
/* =====================================================================================================
   The control plane's backend, running inside the page.
   A port of app/*.py from the repository: the same routes, the same generated SQL, the same run engine,
   on SQLite compiled for the browser (sql.js). Only the local engine exists here: a page in a browser
   cannot reach BigQuery or Databricks, so those need the deployed service.
   ===================================================================================================== */
const BE=(function(){
/* ---------- util.py ---------- */
const IDENT=/^[A-Za-z_][A-Za-z0-9_]*$/;
class ApiError extends Error{constructor(msg,status){super(msg);this.status=status||400}}
class EngineError extends ApiError{}
class NotFound extends ApiError{constructor(msg){super(msg,404)}}
class DataStop extends Error{}
function ident(name,what){what=what||'name';
  if(typeof name!=='string'||!IDENT.test(name))throw new ApiError(`${what} '${name}' may only use letters, digits and underscores, and must not start with a digit`);
  return name}
function slug(text){const s=String(text||'').trim().toLowerCase().replace(/[^a-z0-9_]/g,'_').replace(/^_+|_+$/g,'');
  if(!s)return 'dataset';return /^\d/.test(s)?'c_'+s:s}
const now_ms=()=>Date.now();
const clone=x=>x===undefined?undefined:JSON.parse(JSON.stringify(x));
const commas=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const plural=(n,word)=>word+(n===1?'':'s');
const lines=text=>String(text||'').split(/\r\n|\r|\n/);
const pyfloat=x=>Number.isInteger(x)?x.toFixed(1):String(x);      // how Python prints a float
function pyfixed(x,d){const k=Math.pow(10,d),v=x*k,lo=Math.floor(v);if(v-lo===0.5)return ((lo%2===0?lo:lo+1)/k).toFixed(d);return x.toFixed(d)}   // Python rounds a tie to the even digit
function pyjson(v){                                                 // json.dumps with its default separators
  if(v===null||v===undefined)return 'null';
  if(Array.isArray(v))return '['+v.map(pyjson).join(', ')+']';
  if(typeof v==='object')return '{'+Object.keys(v).map(k=>pyjson(String(k))+': '+pyjson(v[k])).join(', ')+'}';
  if(typeof v==='string')return JSON.stringify(v).replace(/[\u007f-\uffff]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));

M.default_mapping=function(p){const cols=M.parse_cols(p.cfg.columns),mask=p.cfg.maskPii===undefined?true:!!p.cfg.maskPii;
  return {source:`bronze.${p.table}_raw`,rows:cols.map(c=>({src:c.name,stype:'STRING',tgt:c.name,ttype:c.type,tx:c.type==='STRING'?'trim':'cast',nullable:!c.key,pii:!!(c.pii&&mask)}))}};

/* Bronze */
M.stage_table_sql=function(p,eng,src_fq,src_cols,since){
  const wm=p.watermark,select=src_cols.map(([c])=>`${eng.to_str(eng.q(c))} AS ${eng.q(c)}`).join(', ');
  const where=wm&&since?`\nWHERE ${eng.to_str(eng.q(wm))} > ${eng.lit(since)}`:'';
  return `SELECT ${select}, ${eng.lit('table:'+p.path)} AS _source_file\nFROM ${src_fq}${where}`};
M.bronze_sql=function(p,eng,stage_cols,existing,batch,full){
  /* existing: data columns already in the Bronze table, or null when the table does not exist yet */
  const f=M.fqs(p,eng),ctl=p.ctl,rescue=ctl.onNewColumn==='rescue';
  const lineage=`${eng.now()} AS _ingest_ts, ${eng.today()} AS _ingest_date, s._source_file AS _source_file, ${eng.lit(batch)} AS _batch_id`;
  if(existing===null){
    const cols=stage_cols.map(c=>`s.${eng.q(c)} AS ${eng.q(c)}`).join(', '),extra=rescue?`, CAST(NULL AS ${eng.typ('STRING')}) AS _rescued_data`:'';
    return eng.ctas(f.bronze,`SELECT ${cols}, ${lineage}${extra}\nFROM ${f.stg} s`)}
  const fresh=stage_cols.filter(c=>!existing.includes(c)),out=[];let data=existing.slice();
  if(fresh.length&&!rescue){for(const c of fresh)out.push(eng.add_column(f.bronze,c,'STRING'));data=data.concat(fresh)}
  out.push(full?eng.truncate(f.bronze):`DELETE FROM ${f.bronze} WHERE _batch_id = ${eng.lit(batch)}`);
  const names=data.map(c=>eng.q(c)).concat(LINEAGE);
  const values=data.map(c=>stage_cols.includes(c)?`s.${eng.q(c)}`:`CAST(NULL AS ${eng.typ('STRING')})`);
  let select=values.join(', ')+`, ${eng.now()}, ${eng.today()}, s._source_file, ${eng.lit(batch)}`;
  if(rescue){names.push('_rescued_data');select+=', '+(fresh.length?eng.row_json('s',fresh):`CAST(NULL AS ${eng.typ('STRING')})`)}

  return out};

/* Silver */
M.map_expr=function(r,eng,bronze_cols,alias){alias=alias||'b';
  /* returns [text expression before the cast, typed expression] */
  const src=r.src||'',tx=String(r.tx||'').trim(),ttype=norm_type(r.ttype),low=tx.toLowerCase();let base;
  if(PRESETS.includes(low)){

    else{const ref=`NULLIF(TRIM(${alias}.${eng.q(src)}), '')`;
      base={lower:`LOWER(${ref})`,upper:`UPPER(${ref})`,initcap:eng.initcap(ref),'digits only':`NULLIF(${eng.regexp_replace(ref,'[^0-9]','')}, '')`}[low]||ref}
  }else base=`(${tx})`;

M.parse_range=function(param){const text=String(param||''),nums=(text.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number),low=text.toLowerCase();

  return [nums[0],null]};
M.rule_flag=function(rule,eng,ref,mapping_rows){

  const col=rule.column,typ=rule.type,param=String(rule.param||'');
  if(typ==='custom_sql')return param.trim()?`NOT COALESCE((${param}), FALSE)`:null;
  if(!col||col==='*'||!IDENT.test(col))return null;
  const c=`${ref}.${eng.q(col)}`;
  if(typ==='not_null')return `${c} IS NULL`;
  if(typ==='castable'){
    if(mapping_rows===undefined||mapping_rows===null)return `(${c} IS NOT NULL AND TRIM(${c}) <> '' AND ${eng.try_cast(c,param||'STRING')} IS NULL)`;
    const row=mapping_rows.find(r=>r.tgt===col);
    if(!row||norm_type(row.ttype)==='STRING')return null;
    return `(${ref}.${eng.q(col+'__raw')} IS NOT NULL AND ${c} IS NULL)`}
  if(typ==='range'){const [lo,hi]=M.parse_range(param),conds=(lo!==null?[`${c} < ${String(lo)}`]:[]).concat(hi!==null?[`${c} > ${String(hi)}`]:[]);
    return conds.length?'('+conds.join(' OR ')+')':null}
  if(typ==='accepted_values'){const vals=param.split(',').filter(v=>v.trim()).map(v=>v.trim().replace(/^['"]+|['"]+$/g,''));
    return vals.length?`(${c} IS NOT NULL AND ${eng.to_str(c)} NOT IN (${vals.map(v=>eng.lit(v)).join(', ')}))`:null}
  if(typ==='regex')return param?`(${c} IS NOT NULL AND NOT ${eng.regex_ok(c,param)})`:null;
  if(typ==='referential'){const m=/(bronze|silver|gold)\.([A-Za-z0-9_]+)\.([A-Za-z0-9_]+)/.exec(param);
    if(!m)return null;
    const other=eng.fq(m[1],m[2]);
    return `(${c} IS NOT NULL AND ${c} NOT IN (SELECT ${eng.q(m[3])} FROM ${other} WHERE ${eng.q(m[3])} IS NOT NULL))`}
  return null};
M.rule_label=function(rule){const name=rule.type.replace(/_/g,' '),extra=rule.param&&rule.type!=='custom_sql'?` (${rule.param})`:'';
  return rule.column!==null&&rule.column!==undefined&&rule.column!=='*'?`${rule.column}: ${name}${extra}`:`${name}${extra}`};
M.silver_check_sql=function(p,eng,mapping_rows,rules,bronze_cols,batches,full){
  /* the checked staging table: every mapped column typed, plus one flag column per row-level rule.
     returns [statements, [[rule, flag column]]] */
  const f=M.fqs(p,eng),data_cols=bronze_cols.filter(c=>!LINEAGE.includes(c)&&c!=='_rescued_data');
  const cast_rules=new Set(rules.filter(r=>r.type==='castable').map(r=>r.column)),inner=[];
  for(const r of mapping_rows){const [base,typed]=M.map_expr(r,eng,bronze_cols);
    inner.push(`${typed} AS ${eng.q(r.tgt)}`);
    if(cast_rules.has(r.tgt)&&norm_type(r.ttype)!=='STRING')inner.push(`${base} AS ${eng.q(r.tgt+'__raw')}`)}
  inner.push('b._ingest_ts AS _ingest_ts');
  inner.push(`${eng.row_json('b',data_cols)} AS _row`);
  const where=full||!batches||!batches.length?'':'\n  WHERE b._batch_id IN ('+batches.map(x=>eng.lit(x)).join(', ')+')';

M.silver_new_sql=function(p,eng,mapping_rows,exclude_flags){
  /* the rows that will be merged: bad rows left out, duplicates removed, personal data masked */
  const f=M.fqs(p,eng),ctl=p.ctl,keys=p.keys,cols=[];
  for(const r of mapping_rows){const c=`y.${eng.q(r.tgt)}`,t=norm_type(r.ttype);
    if(r.pii&&ctl.mask&&t==='STRING')cols.push(`${eng.sha256(`LOWER(${c})`)} AS ${eng.q(r.tgt)}`);
    else cols.push(`CAST(${c} AS ${eng.typ(t)}) AS ${eng.q(r.tgt)}`)}
  cols.push('y._ingest_ts AS _ingest_ts');
  if(p.scd==='2'){const tracked=mapping_rows.map(r=>r.tgt).filter(c=>!keys.includes(c)),parts=[];
    for(const c of tracked)parts.push(`COALESCE(${eng.to_str('y.'+eng.q(c))}, '')`,"'|'");
    cols.push(`${eng.sha256(eng.concat(parts.length?parts:["''"]))} AS row_hash`)}

    src=`(\n  SELECT x.*, ROW_NUMBER() OVER (PARTITION BY ${part} ORDER BY x._ingest_ts DESC) AS _rn\n  FROM ${f.chk} x${where}\n) y\nWHERE y._rn = 1`}
  else src=`(\n  SELECT x.*\n  FROM ${f.chk} x${where}\n) y`;
  return eng.ctas(f.new,'SELECT '+cols.join(',\n  ')+'\nFROM '+src)};
M.silver_columns=function(p,mapping_rows){let cols=mapping_rows.map(r=>[r.tgt,norm_type(r.ttype)]).concat([['_ingest_ts','TIMESTAMP']]);
  if(p.scd==='2')cols=cols.concat([['row_hash','STRING'],['valid_from','TIMESTAMP'],['valid_to','TIMESTAMP'],['is_current','BOOLEAN']]);
  return cols};
M.silver_write_sql=function(p,eng,mapping_rows,existing,full){
  /* existing: column names already in the Silver table, or null when it does not exist yet */
  const f=M.fqs(p,eng),keys=p.keys,base=mapping_rows.map(r=>r.tgt).concat(['_ingest_ts']),names=base.map(c=>eng.q(c)).join(', '),scd2=p.scd==='2',ts=eng.typ('TIMESTAMP');
  if(existing===null){
    if(scd2)return eng.ctas(f.silver,`SELECT ${names}, row_hash, _ingest_ts AS valid_from, CAST(NULL AS ${ts}) AS valid_to, TRUE AS is_current\nFROM ${f.new}`);
    return eng.ctas(f.silver,`SELECT ${names}\nFROM ${f.new}`)}
  const out=M.silver_columns(p,mapping_rows).filter(([c])=>!existing.includes(c)).map(([c,t])=>eng.add_column(f.silver,c,t));
  if(scd2){const on=keys.map(k=>`s.${eng.q(k)} = t.${eng.q(k)}`).join(' AND ');

    out.push(`INSERT INTO ${f.silver} (${names}, row_hash, valid_from, valid_to, is_current)\nSELECT ${base.map(c=>'s.'+eng.q(c)).join(', ')}, s.row_hash, s._ingest_ts, CAST(NULL AS ${ts}), TRUE\nFROM ${f.new} s\n`+

  if(full)return out.concat([eng.truncate(f.silver),`INSERT INTO ${f.silver} (${names})\nSELECT ${names}\nFROM ${f.new}`]);
  return out.concat(eng.upsert(f.silver,f.new,keys,base))};

/* Gold */
M.gold_select=function(p,eng){
  const f=M.fqs(p,eng),g=p.cfg.gold||{},t=p.table,current=p.scd==='2'?'\nWHERE is_current':'',kind=g.type||'aggregate';
  if(kind==='sql'){

    return sql.replace(/\{(bronze|silver|gold)\.([A-Za-z0-9_]+)\}/g,(m,a,b)=>eng.fq(a,b))}
  if(kind==='dimension'){
    const cols=M.parse_cols(p.cfg.columns),keys=p.keys.concat(p.scd==='2'?['valid_from']:[]),parts=[];
    for(const k of keys)parts.push(`COALESCE(${eng.to_str(eng.q(k))}, '')`,"'|'");
    const attrs=cols.map(c=>eng.q(c.name)).concat(p.scd==='2'?['valid_from','valid_to','is_current']:[]);
    return `SELECT ${eng.sha256(eng.concat(parts))} AS ${eng.q(t+'_sk')},\n  `+attrs.join(',\n  ')+`,\n  ${eng.now()} AS _built_at\nFROM ${f.silver}`}
  const grain=[g.dateCol||''].concat(String(g.dims||'').split(',')).filter(x=>x.trim()).map(x=>ident(x.trim(),'Gold column'));
  const measures=lines(g.measures||'COUNT(*) AS row_count').filter(m=>m.trim()).map(m=>m.trim().replace(/,+$/,''));
  const select=grain.map(x=>eng.q(x)).concat(measures,[`${eng.now()} AS _built_at`]).join(',\n  ');
  const group=grain.length?'\nGROUP BY '+grain.map(x=>eng.q(x)).join(', '):'';

M.gold_sql=function(p,eng){const f=M.fqs(p,eng),gate=p.ctl.gate===undefined?true:p.ctl.gate;return eng.ctas(gate?f.gold_new:f.gold,M.gold_select(p,eng))};
M.plan=function(p,eng,mapping_rows,rules){
  /* the statements a run would execute, for display. Column lists assume the declared columns. */
  const declared=M.parse_cols(p.cfg.columns).map(c=>c.name),f=M.fqs(p,eng),gate=p.ctl.gate===undefined?true:p.ctl.gate;
  const silver_rules=rules.filter(r=>r.table===`silver.${p.table}`&&(r.on===undefined||r.on));
  const [chk,flags]=M.silver_check_sql(p,eng,mapping_rows,silver_rules,declared.concat(LINEAGE),['<run id>'],p.pattern==='full');
  const excl=flags.filter(([r])=>['quarantine','fail'].includes(r.severity)).map(([,name])=>name);
  const source=p.kind==='files'?'-- Files are staged into '+f.stg+' as text, one column per source column\n':'';
  return {
    bronze:source+M.bronze_sql(p,eng,declared,null,'<run id>',false).join(';\n\n')+';',
    silver:chk.concat(M.silver_new_sql(p,eng,mapping_rows,excl),M.silver_write_sql(p,eng,mapping_rows,M.silver_columns(p,mapping_rows).map(([c])=>c),p.pattern==='full')).join(';\n\n')+';',
    gold:M.gold_sql(p,eng).concat(gate?['-- after the Gold checks pass\n'+eng.ctas(f.gold,`SELECT * FROM ${f.gold_new}`).slice(-1)[0]]:[]).join(';\n\n')+';'}};

/* ---------- quality.py: each rule becomes SQL that counts what fails ---------- */
const DIMENSION={not_null:'Completeness',unique:'Uniqueness',range:'Validity',accepted_values:'Validity',regex:'Validity',castable:'Validity',referential:'Consistency',freshness:'Timeliness',
  row_count:'Completeness',volume_anomaly:'Completeness',reconciliation:'Accuracy',schema:'Consistency',custom_sql:'Consistency'};
const ROW_RULES=['not_null','castable','range','accepted_values','regex','referential','custom_sql'];
const Q={};
Q.first_number=function(text,dflt){const m=/-?\d+(?:\.\d+)?/.exec(String(text||''));return m?parseFloat(m[0]):dflt};
Q.minutes=function(text,dflt){if(dflt===undefined)dflt=120;const m=/(\d+(?:\.\d+)?)\s*(minute|min|hour|hr|day)/.exec(String(text||'').toLowerCase());

Q.violated=function(rule,checked,failed){return Q.pass_rate(checked,failed)<Number(rule.min!==undefined&&rule.min!==null?rule.min:100)};
Q.record=function(rule,checked,failed){Object.assign(rule,{checked:Math.trunc(checked),failed:Math.trunc(failed),pass:Q.pass_rate(checked,failed),last:now_ms()})};
Q.evaluate=function(rule,eng,p,state,ctx){

  ctx=ctx||{};
  const dot=rule.table.indexOf('.'),layer=rule.table.slice(0,dot),name=rule.table.slice(dot+1),f=M.fqs(p,eng);
  const fq=(ctx.override||{})[rule.table]||eng.fq(layer,name),typ=rule.type,col=rule.column||'*',param=String(rule.param||'');
  let scope='';
  if(layer==='bronze'&&ctx.batches&&ctx.batches.length)scope=' WHERE x._batch_id IN ('+ctx.batches.map(b=>eng.lit(b)).join(', ')+')';

  if(typ==='schema'){const drift=ctx.drift;
    if(drift===undefined||drift===null){const pending=(state.drift||[]).filter(d=>d.table===rule.table&&d.status==='pending');
      return [1,pending.length?1:0,pending.length?'new columns are waiting for a decision':'']}
    return [1,drift.length?1:0,drift.length?'new columns: '+drift.join(', '):'']}

    if(ctx.in_run)return [1,0,'written by this run'];

    return [1,age>limit?1:0,`${pyfixed(age,0)} minutes old, limit ${pyfixed(limit,0)}`]}
  if(typ==='volume_anomaly'){const rows=ctx.bronze_rows,hist=(p.history||[]).map(h=>h.rows).slice(-7);
    if(rows===undefined||rows===null||hist.length<3)return null;
    const avg=hist.reduce((a,b)=>a+b,0)/hist.length,tol=Q.first_number(param,30),off=avg?Math.abs(rows-avg)/avg*100:0;
    return [1,off>tol?1:0,`${rows} rows against a recent average of ${pyfixed(avg,0)} (${pyfixed(off,0)}% away, limit ${pyfixed(tol,0)}%)`]}
  if(typ==='row_count'){const need=Math.trunc(Q.first_number(param,1)),n=Number(eng.scalar(`SELECT COUNT(*) AS n FROM ${fq} x${scope}`)||0);
    return [1,n<need?1:0,`${n} rows, at least ${need} expected`]}
  if(typ==='unique'){const cols=col!=='*'?[col]:p.keys,where=layer==='silver'&&p.scd==='2'?' WHERE x.is_current':scope;
    let expr=`x.${eng.q(cols[0])}`;
    if(cols.length>1){const parts=[];for(const c of cols)parts.push(`COALESCE(${eng.to_str('x.'+eng.q(c))}, '')`,"'|'");expr=eng.concat(parts)}
    const r=eng.query(`SELECT COUNT(*) AS n, COUNT(DISTINCT ${expr}) AS d FROM ${fq} x${where}`)[0],n=Number(r.n||0),d=Number(r.d||0);

    if(layer==='gold'&&col!=='*'){const m=/of\s+(.+?)\s+in\s+silver/i.exec(param),silver_expr=m?m[1]:`SUM(${eng.q(col)})`,where=p.scd==='2'?' WHERE is_current':'';
      const g=Number(eng.scalar(`SELECT SUM(${eng.q(col)}) AS v FROM ${fq}`)||0),s=Number(eng.scalar(`SELECT ${silver_expr} AS v FROM ${f.silver}${where}`)||0);
      const off=s?Math.abs(g-s)/Math.abs(s)*100:(g===0?0:100);
      return [1,off>tol?1:0,`Gold ${pyfixed(g,2)} against Silver ${pyfixed(s,2)} (${pyfixed(off,3)}% apart, tolerance ${pyfloat(tol)}%)`]}
    if(layer==='silver'&&ctx.bronze_rows!==undefined&&ctx.bronze_rows!==null){const b=ctx.bronze_rows,s=ctx.silver_rows||0,qn=ctx.quarantined||0,lost=Math.max(0,b-s-qn),off=b?lost/b*100:0;
      return [1,off>tol?1:0,`${b} rows in, ${s} merged, ${qn} quarantined, ${lost} removed as duplicates (${pyfixed(off,2)}%, tolerance ${pyfloat(tol)}%)`]}

      const mapping=((state.mappings||{})[rule.table]||{}).rows||[],row=mapping.find(r=>r.tgt===col);
      if(!row||norm_type(row.ttype)==='STRING')return null;
      const bronze_cols=eng.columns('bronze',p.table+'_raw').map(([c])=>c);
      if(!bronze_cols.length)return null;
      const [base,typed]=M.map_expr(row,eng,bronze_cols);
      const r=eng.query(`SELECT COUNT(*) AS n, SUM(CASE WHEN ${base} IS NOT NULL AND ${typed} IS NULL THEN 1 ELSE 0 END) AS f FROM ${f.bronze} b`)[0];

    const r=eng.query(`SELECT COUNT(*) AS n, SUM(CASE WHEN ${cond} THEN 1 ELSE 0 END) AS f FROM ${fq} x${where}`)[0];
    return [Number(r.n||0),Number(r.f||0),'']}

Q.recommended=function(p,layer,tables){

runner.start_run=function(pid,trigger,full,resume){trigger=trigger||'manual';
  const p=store.pipeline(pid);
  if(!p)throw new ApiError(`There is no pipeline called ${pid}`);
  if(p.status==='paused'&&trigger!=='manual')throw new ApiError(`${pid} is paused`);
  if(store.data.runs.some(r=>r.pid===pid&&r.status==='running'))throw new ApiError(`${pid} already has a run in progress`);

    if(tasks[failed_at].id==='dq_gold'&&gated(p)&&failed_at>0)failed_at-=1;          // the unpublished Gold build was dropped, so build it again

        p.pattern==='full'?'Full reload each run':'Incremental append, new files or rows only',['src:'+p.id]],

        cols:cols.map(([c,t])=>({name:c,type:String(t),key:p.keys.includes(c)&&layer!=='gold',pii:pii.has(c),mask:pii.has(c)&&layer!=='bronze'&&p.ctl.mask?'hash':'none',desc:''}))})}}

service.state_view=function(){const d=store.data;
  return {settings:settings.public(),connections:d.connections,pipelines:d.pipelines,tables:service.tables_view(),

/* connections */
service.save_connection=function(body,create){
  const cid=ident(String(body.id||'').trim().toLowerCase(),'connection name'),typ=body.type;
  if(!ENGINE_TYPES[typ]&&!CLOUD_ENGINES[typ]&&!FILE_TYPES[typ])throw new ApiError('Choose a connection type');
  let endpoint=String(body.endpoint||'').trim();
  if(!endpoint&&(typ==='local'||typ==='folder'))endpoint='in this browser';
  if(!endpoint&&typ!=='bq')throw new ApiError('Fill in where this system is');
  const options={};for(const [k,v] of Object.entries(body.options||{}))if(String(v).trim())options[k]=String(v).trim();
  const existing=store.connection(cid);
  if(create&&existing)throw new ApiError(`A connection named ${cid} already exists`);
  if(!create&&!existing)throw new NotFound(`There is no connection called ${cid}`);
  const conn=existing||{id:cid,status:'idle',tested:0,note:''};
  Object.assign(conn,{type:typ,endpoint,auth:String(body.auth||''),secret:String(body.secret||'').trim(),options,cloud:{local:'local',folder:'local',bq:'gcp',gcs:'gcp',adb:'azure',adls:'azure'}[typ]});
  if(!existing){store.data.connections.push(conn);if(typ==='folder'&&!FILES[cid])FILES[cid]={}}
  store.audit(create?'Added connection':'Edited connection',cid,typ);
  return service.test_connection(cid)};
service.test_connection=function(cid){
  const conn=store.connection(cid);
  if(!conn)throw new NotFound(`There is no connection called ${cid}`);
  const start=now_ms();
  try{let note;
    if(ENGINE_TYPES[conn.type]){const eng=get_engine(conn);note=eng.test();eng.ensure_schemas()}
    else if(conn.type==='folder'){const n=Object.keys(FILES[cid]||{}).length;note=`${n} file${n===1?'':'s'} uploaded`}
    else throw new EngineError(NEEDS_SERVICE({bq:'BigQuery',gcs:'Cloud Storage',adb:'Azure Databricks',adls:'Azure storage'}[conn.type]||'that system'));
    Object.assign(conn,{status:'healthy',note});
  }catch(e){Object.assign(conn,{status:'down',note:String(e.message||e).slice(0,400)})}
  conn.tested=now_ms();conn.ms=now_ms()-start;
  store.log(conn.status==='healthy'?'INFO':'ERROR','connections',cid,`Connection test ${conn.status==='healthy'?'passed':'failed'} in ${conn.ms} ms: ${conn.note}`);
  store.save();
  return conn};
service.delete_connection=function(cid){
  const used=store.data.pipelines.filter(p=>cid===p.target||cid===p.source).map(p=>p.id);
  if(used.length)throw new ApiError(`${cid} is used by ${used.join(', ')}. Delete or repoint those pipelines first.`);
  store.data.connections=store.data.connections.filter(c=>c.id!==cid);
  delete FILES[cid];if(ENGINES[cid]){try{ENGINES[cid].db&&ENGINES[cid].db.close()}catch(e){}delete ENGINES[cid]}
  store.audit('Removed connection',cid)};

/* pipelines */
function _new_rule(table,column,typ,param,severity){
  return {id:store.next_id('dq'),table,column:column||'*',type:typ,param:param||'',severity,on:true,min:100,pass:100,checked:0,failed:0,last:0}}
function _prepare(cfg){
  const target=store.connection(cfg.target||'');
  if(target&&CLOUD_ENGINES[target.type])throw new ApiError(NEEDS_SERVICE(CLOUD_ENGINES[target.type]));
  if(!target||!ENGINE_TYPES[target.type])throw new ApiError('Choose the warehouse this pipeline writes to');
  const cls=ENGINE_TYPES[target.type],p=M.build_pipeline(cfg,target,cls);
  if(p.kind==='files'){
    const src=store.connection(p.source);
    if(!src||FILE_TYPES[src.type]!==target.type){
      const need={local:'a local folder',bq:'a Cloud Storage bucket',adb:'an ADLS or cloud storage path'}[target.type];
      throw new ApiError(`Files for ${cls.label} come from ${need} connection. Choose one as the source.`)}
  }else p.source=target.id;
  if(!cron_valid(p.cron))throw new ApiError('The schedule is not a valid five field cron expression');
  return [p,target]}
service.deploy_pipeline=function(cfg,by){by=by||'pipeline builder';
  const [p,target]=_prepare(cfg);
  if(store.pipeline(p.id))throw new ApiError(`${p.id} already exists. Use another dataset name, or delete the existing pipeline.`);
  const clash=store.data.pipelines.find(x=>x.writes.some(w=>p.writes.includes(w)));
  if(clash)throw new ApiError(`${clash.id} already writes one of these tables. Choose another Gold table name.`);
  p.created=now_ms();
  M.gold_select(p,get_engine(target));                 // fails early on a bad Gold definition
  store.data.pipelines.push(p);
  store.data.mappings[p.writes[1]]=M.default_mapping(p);
  for(const [t,c,ty,pa,sev] of M.default_rules(p))store.data.rules.push(_new_rule(t,c,ty,pa,sev));
  store.audit('Deployed pipeline',p.id,`By ${by}. Writes ${p.writes.join(', ')}`);
  store.log('INFO',p.id,p.tasks[0].id,`Pipeline ${p.id} registered on ${p.engine}`);
  return p};
service.plan_sql=function(cfg,pid){let p,mapping,rules;
  if(pid){p=_pipeline(pid);mapping=(store.data.mappings[p.writes[1]]||M.default_mapping(p)).rows;rules=store.data.rules}
  else{p=_prepare(cfg||{})[0];mapping=M.default_mapping(p).rows;
    rules=M.default_rules(p).map((r,i)=>({table:r[0],column:r[1],type:r[2],param:r[3],severity:r[4],id:`dq${i}`,on:true,min:100}))}
  return M.plan(p,_engine(p),mapping,rules)};
service.delete_pipeline=function(pid,drop_tables){
  const p=_pipeline(pid);
  if(store.data.runs.some(r=>r.pid===pid&&r.status==='running'))throw new ApiError('Wait for the run in progress to finish before deleting this pipeline');
  const dropped=[];
  if(drop_tables){const eng=_engine(p),f=M.fqs(p,eng);
    for(const key of ['bronze','stg','silver','chk','new','quar','gold','gold_new']){
      try{eng.execute(eng.drop(f[key]));if(['bronze','silver','gold','quar'].includes(key))dropped.push(f[key])}
      catch(e){if(!(e instanceof EngineError))throw e;store.log('WARN',pid,'delete',`Could not drop ${f[key]}: ${e.message}`)}}}
  const d=store.data,gone=new Set(p.writes);
  d.pipelines=d.pipelines.filter(x=>x.id!==pid);
  d.rules=d.rules.filter(r=>!gone.has(r.table));
  d.quarantine=d.quarantine.filter(q=>!gone.has(q.table));
  d.drift=d.drift.filter(x=>!gone.has(x.table));
  d.runs=d.runs.filter(r=>r.pid!==pid);
  d.alerts=d.alerts.filter(a=>a.pid!==pid);
  for(const t of gone){delete d.mappings[t];delete d.tstats[t]}
  store.audit('Deleted pipeline',pid,drop_tables?'Tables dropped':'Tables kept in the warehouse');
  return {dropped}};
const toInt=(v,dflt)=>{const n=parseInt(v,10);return Number.isFinite(n)?n:dflt};
service.set_schedule=function(pid,body){
  const p=_pipeline(pid),cron=String(body.cron||p.cron).trim();
  if(!cron_valid(cron))throw new ApiError('That is not a valid cron expression. Use five fields, for example 0 * * * *');
  Object.assign(p,{cron,retries:Math.max(0,Math.min(5,toInt(body.retries===undefined?p.retries:body.retries,0)||0)),sla:Math.max(1,toInt(body.sla===undefined?p.sla:body.sla,p.sla)||p.sla)});
  store.audit('Changed schedule',pid,`${cron}, ${p.retries} retries`);
  return p};
service.toggle_pipeline=function(pid){const p=_pipeline(pid);
  p.status=p.status==='paused'?'active':'paused';
  store.audit(p.status==='paused'?'Paused pipeline':'Resumed pipeline',pid);
  return p};
service.set_control=function(pid,key,value){
  const p=_pipeline(pid);
  if(key==='retries')p.retries=Math.max(0,Math.min(5,Math.trunc(parseFloat(value||0))||0));
  else if(key==='breaker')p.ctl.breaker=Math.max(0,Math.min(100,parseFloat(value||0)||0));
  else if(key==='onNewColumn'||key==='onEmpty'){
    const allowed={onNewColumn:['accept','rescue','stop'],onEmpty:['skip','continue','fail']}[key];
    if(!allowed.includes(value))throw new ApiError(`${key} must be one of ${allowed.join(', ')}`);
    p.ctl[key]=value}
  else if(key in DEFAULT_CTL)p.ctl[key]=!!value;
  else throw new ApiError(`Unknown control ${key}`);
  store.audit('Changed control',pid,`${key} = ${key==='retries'?p.retries:pystr(p.ctl[key])}`);
  return p};

/* mappings and checks */
service.save_mapping=function(table,rows){
  const p=_pipeline_of(table),clean=[],seen=new Set();
  for(const r of rows){
    const tgt=ident(String(r.tgt||'').trim(),'target column');
    if(seen.has(tgt))throw new ApiError(`Target column ${tgt} is mapped twice`);
    seen.add(tgt);
    clean.push({src:String(r.src||'').trim(),stype:'STRING',tgt,ttype:norm_type(r.ttype),tx:String(r.tx||'trim').trim(),nullable:r.nullable===undefined?true:!!r.nullable,pii:!!r.pii})}
  const missing=p.keys.filter(k=>!seen.has(k));
  if(missing.length)throw new ApiError(`The business key ${missing.join(', ')} must stay in the mapping`);
  store.data.mappings[table]={source:p.writes[0],rows:clean};
  for(const r of clean)             // a required column gets a not-null check if it has none
    if(!r.nullable&&!store.data.rules.some(x=>x.table===table&&x.column===r.tgt&&x.type==='not_null'))store.data.rules.push(_new_rule(table,r.tgt,'not_null','','fail'));
  store.audit('Saved mapping',table,`${clean.length} columns`);
  return store.data.mappings[table]};
service.add_rule=function(body){
  const table=String(body.table||''),p=_pipeline_of(table),typ=body.type;
  if(!DIMENSION[typ])throw new ApiError('Choose a check type');
  const col=String(body.column||'*').trim();
  if(col!=='*')ident(col,'column');
  const severity=['fail','quarantine','warn'].includes(body.severity)?body.severity:'warn';
  const rule=_new_rule(table,col,typ,String(body.param||'').trim(),severity);
  if(ROW_RULES.includes(typ)&&typ!=='custom_sql'&&col==='*')throw new ApiError('This check needs a column name');
  if(M.rule_flag(rule,_engine(p),'x')===null&&['range','accepted_values','regex','referential'].includes(typ))
    throw new ApiError({range:'Give the range as two numbers, for example 0 to 100000',accepted_values:'List the allowed values, separated by commas',
      regex:'Give the pattern the value must match',referential:'Name the reference as layer.table.column'}[typ]);
  store.data.rules.push(rule);
  store.audit('Added check',`${table}.${col}`,typ,body._by||'you');
  return rule};
service.update_rule=function(rid,body){
  const r=store.find('rules',rid);
  if(!r)throw new NotFound('That check no longer exists');
  if('on' in body)r.on=!!body.on;
  if('min' in body)r.min=Math.max(0,Math.min(100,parseFloat(body.min||0)||0));
  if(['fail','quarantine','warn'].includes(body.severity))r.severity=body.severity;
  store.audit('Changed check',`${r.table}.${r.column}`,`${r.type}: on=${r.on?'True':'False'}, pass at least ${String(r.min)}%, on failure ${r.severity}`);
  return r};
service.delete_rule=function(rid){const r=store.find('rules',rid);
  store.data.rules=store.data.rules.filter(x=>x.id!==rid);
  if(r)store.audit('Removed check',`${r.table}.${r.column}`,r.type)};
service.recommend_rules=function(pid,layer){
  const p=_pipeline(pid),mapping={};for(const [t,m] of Object.entries(store.data.mappings))mapping[t]=m.rows;
  let added=0;
  for(const [t,c,ty,pa,sev] of Q.recommended(p,layer,mapping)){
    if(store.data.rules.some(r=>r.table===t&&r.column===c&&r.type===ty))continue;
    store.data.rules.push(_new_rule(t,c,ty,pa,sev));added+=1}
  store.audit('Added recommended checks',pid,`${added} on ${layer}`);
  return {added}};
service.run_checks=function(table){
  /* evaluate every enabled check against the tables as they are now. Nothing is written or quarantined. */
  let done=0,problems=0,skipped=0;
  for(const rule of store.data.rules){
    if(!(rule.on===undefined||rule.on)||(table&&rule.table!==table))continue;
    const p=store.data.pipelines.find(x=>x.writes.includes(rule.table));
    if(!p||!(rule.table in store.data.tstats)){skipped+=1;continue}
    let res;
    try{res=Q.evaluate(rule,_engine(p),p,store.data)}
    catch(e){if(!(e instanceof EngineError))throw e;store.log('WARN',p.id,'checks',`Check ${M.rule_label(rule)} on ${rule.table} could not run: ${e.message}`);skipped+=1;continue}
    if(res===null){skipped+=1;continue}
    Q.record(rule,res[0],res[1]);done+=1;problems+=Q.violated(rule,res[0],res[1])?1:0}
  store.audit('Ran checks',table||'all tables',`${done} evaluated, ${problems} failing, ${skipped} not applicable yet`);
  return {evaluated:done,failing:problems,skipped}};

/* tables, quarantine, drift */
function _table_ref(table_id){const p=_pipeline_of(table_id),dot=table_id.indexOf('.');return [p,_engine(p),table_id.slice(0,dot),table_id.slice(dot+1)]}
service.preview_table=function(table_id,limit){if(limit===undefined)limit=5;
  const [,eng,layer,name]=_table_ref(table_id);
  if(!eng.exists(layer,name))return {columns:[],rows:[],note:'This table has not been built yet. Run the pipeline first.'};
  const rows=eng.query(`SELECT * FROM ${eng.fq(layer,name)} LIMIT ${Math.max(1,Math.min(50,toInt(limit,5)))}`);
  return {columns:rows.length?Object.keys(rows[0]):eng.columns(layer,name).map(([c])=>c),rows,note:''}};
service.refresh_tables=function(){
  for(const p of store.data.pipelines){
    let eng;try{eng=_engine(p)}catch(e){if(e instanceof EngineError)continue;throw e}
    const names=M.table_names(p);
    for(const layer of LAYERS){const name=names[layer],tid=`${layer}.${name}`;let cols,s;
      try{cols=eng.columns(layer,name);if(!cols.length)continue;s=eng.stats(layer,name)}catch(e){if(e instanceof EngineError)continue;throw e}
      const old=store.data.tstats[tid]||{};
      store.data.tstats[tid]={rows:s.rows,bytes:s.bytes===undefined?null:s.bytes,fresh:old.fresh||now_ms(),version:old.version===undefined?1:old.version,cols:cols.map(([c,t])=>[c,t])}}}
  store.save()};
service.quarantine_rows=function(table_id,run_id){
  const [p,eng]=_table_ref(table_id),f=M.fqs(p,eng);
  const rows=eng.query(`SELECT _reason, _row FROM ${f.quar} WHERE _run_id = ${eng.lit(run_id)} LIMIT 50`);
  return {rows:rows.map(r=>{let data;try{data=JSON.parse(r._row);if(data===null||typeof data!=='object')data={row:r._row}}catch(e){data={row:r._row}}return {reason:r._reason,row:data}})}};
service.discard_quarantine=function(table_id,run_id){
  const [p,eng]=_table_ref(table_id),f=M.fqs(p,eng);
  eng.execute(`DELETE FROM ${f.quar} WHERE _run_id = ${eng.lit(run_id)}`);
  store.data.quarantine=store.data.quarantine.filter(q=>!(q.table===table_id&&q.run===run_id));
  store.audit('Discarded quarantined rows',table_id,run_id)};
service.drift_action=function(table_id,col,action){
  const d=store.data.drift.find(x=>x.table===table_id&&x.col===col);
  if(!d)throw new NotFound('That column is no longer waiting for a decision');
  const p=_pipeline_of(table_id);
  if(action==='map'){const silver=p.writes[1];
    if(!store.data.mappings[silver])store.data.mappings[silver]=M.default_mapping(p);
    const m=store.data.mappings[silver];
    if(!m.rows.some(r=>r.tgt===col))m.rows.push({src:col,stype:'STRING',tgt:ident(col,'column'),ttype:'STRING',tx:'trim',nullable:true,pii:false});
    d.status='mapped';store.audit('Mapped new column',silver,`${col}. It is filled from the next run on`)}
  else{d.status='ignored';store.audit('Kept new column in Bronze only',table_id,col)}
  return d};

/* compute and governance */
service.compute_view=function(){const out=[];
  for(const conn of store.data.connections){
    if(!ENGINE_TYPES[conn.type]&&!CLOUD_ENGINES[conn.type])continue;
    let items;
    try{items=get_engine(conn).compute()}catch(e){items=[{id:conn.id,kind:CLOUD_ENGINES[conn.type]||'Engine',spec:String(e.message||e).slice(0,200),state:'down',canToggle:false}]}
    const used=store.data.pipelines.filter(p=>p.target===conn.id).map(p=>p.id);
    for(const it of items)out.push({...it,conn:conn.id,platform:{local:'local',bq:'gcp',adb:'azure'}[conn.type],used})}
  return out};
service.toggle_compute=function(){throw new ApiError('This engine has no compute to start or stop')};
service.erase=function(column,value,confirm){
  /* delete every row for one person from Silver and Gold tables that carry the given column */
  ident(column,'column');
  const plan=[];
  for(const t of service.tables_view()){
    if(t.layer==='bronze'||!t.built||!t.cols.some(c=>c.name===column))continue;
    const [,eng,layer,name]=_table_ref(t.id),fq=eng.fq(layer,name);
    const n=Number(eng.scalar(`SELECT COUNT(*) AS n FROM ${fq} WHERE ${eng.to_str(eng.q(column))} = ${eng.lit(value)}`)||0);
    plan.push({table:t.id,rows:n});
    if(confirm&&n)eng.execute(`DELETE FROM ${fq} WHERE ${eng.to_str(eng.q(column))} = ${eng.lit(value)}`)}
  if(confirm)store.audit('Erased a person',column,`${plan.reduce((a,x)=>a+x.rows,0)} rows deleted from ${plan.filter(x=>x.rows).length} tables`);
  return {tables:plan,done:!!confirm}};
service.secrets_view=function(){return store.data.connections.filter(c=>c.secret).map(c=>({name:c.secret,used:c.id,found:'missing'}))};
service.list_source_files=function(cid,path,fmt){
  const src=store.connection(cid);
  if(!src||!FILE_TYPES[src.type])throw new ApiError('Choose a file connection');
  const want=FILE_TYPES[src.type];
  if(CLOUD_ENGINES[want])throw new ApiError(NEEDS_SERVICE(CLOUD_ENGINES[want]));
  const eng_conn=store.data.connections.find(c=>c.type===want);
  if(!eng_conn)throw new ApiError('Add the warehouse connection that reads this storage first');
  const files=get_engine(eng_conn).list_files(src,{path:path||'',format:fmt||'csv'});
  return {files:files.slice(0,200),total:files.length}};
service.detect_columns=function(cfg){
  /* look at the real source and suggest the column list: names from the file header or table, types from the values */
  const target=store.connection(cfg.target||'');
  if(target&&CLOUD_ENGINES[target.type])throw new ApiError(NEEDS_SERVICE(CLOUD_ENGINES[target.type]));
  if(!target||!ENGINE_TYPES[target.type])throw new ApiError('Choose the warehouse first');
  const eng=get_engine(target);let cols;
  if(cfg.kind==='table'){cols=eng.source_table(String(cfg.path||''))[1].map(([c,t])=>[c,norm_type(t)]).filter(([c])=>!LINEAGE.includes(c))}
  else{
    const src=store.connection(cfg.conn||'');
    if(!src||FILE_TYPES[src.type]!==target.type)throw new ApiError('Choose the file connection that belongs to this warehouse');
    const files=eng.list_files(src,cfg);
    if(!files.length)throw new ApiError('No files of that format were found in the folder');
    eng.ensure_schemas();
    const stage=eng.fq('bronze',ident(slug(cfg.name||'dataset'),'dataset name')+'__peek');
    try{
      const names=eng.stage_files(src,cfg,files.slice(-1),stage),probes=[];
      for(const c of names){const v=`NULLIF(TRIM(${eng.q(c)}), '')`;
        probes.push(`SUM(CASE WHEN ${v} IS NOT NULL THEN 1 ELSE 0 END) AS ${eng.q('n_'+c)}`);
        for(const [tag,typ] of [['i','BIGINT'],['d','DECIMAL(18,2)'],['t','TIMESTAMP'],['b','BOOLEAN']])probes.push(`SUM(CASE WHEN ${eng.try_cast(v,typ)} IS NOT NULL THEN 1 ELSE 0 END) AS ${eng.q(tag+'_'+c)}`);
        probes.push(`SUM(CASE WHEN LENGTH(${v}) = 10 AND ${eng.try_cast(v,'DATE')} IS NOT NULL THEN 1 ELSE 0 END) AS ${eng.q('y_'+c)}`)}
      const r=names.length?eng.query(`SELECT ${probes.join(', ')} FROM ${stage}`)[0]:{};
      cols=names.map(c=>{const n=Number(r['n_'+c]||0),hit=tag=>n>0&&Number(r[tag+'_'+c]||0)>=0.9*n;      // the few misfits are what the checks catch
        return [c,hit('i')?'BIGINT':hit('d')?'DECIMAL(18,2)':hit('y')?'DATE':hit('t')?'TIMESTAMP':'STRING']});
    }finally{eng.execute(eng.drop(stage))}}
  const found=cols.find(([c])=>c.toLowerCase()==='id'||c.toLowerCase().endsWith('_id')),key=found?found[0]:(cols.length?cols[0][0]:'');
  const out=cols.map(([c,t])=>`${c}:${t}`+(c===key?':key':/email|phone|full_name|first_name|last_name|address/i.test(c)?':pii':''));
  return {columns:out.join('\n'),count:cols.length}};

service.files_view=function(cid){const conn=store.connection(cid);

service.put_file=function(cid,folder,name,text){const conn=store.connection(cid);
  if(!conn||conn.type!=='folder')throw new NotFound('That is not a landing area');
  folder=String(folder||'').trim().replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');
  name=String(name||'').trim().replace(/\\/g,'/').split('/').pop();
  if(!folder)throw new ApiError('Name the folder the files go into, for example orders');
  if(!/^[A-Za-z0-9_\-/]+$/.test(folder))throw new ApiError('A folder name may use letters, digits, underscores, hyphens and slashes');
  if(!name)throw new ApiError('Give the file a name');
  if(!/\.(csv|json|jsonl|ndjson)$/i.test(name))throw new ApiError(`${name} is not a CSV or JSON file. The local engine reads .csv, .json, .jsonl and .ndjson.`);

service.grants=function(apply,roles){
  if(roles!==undefined&&roles!==null){store.data.roles=roles;store.audit('Changed access matrix','roles')}
  roles=store.data.roles.length?store.data.roles:DEFAULT_ROLES;
  const out=[];
  for(const conn of store.data.connections){
    if(!CLOUD_ENGINES[conn.type])continue;
    for(const role of roles){const who=String(role.principal||'').trim();if(!who)continue;
      for(const layer of LAYERS){const acc=(role.acc||{})[layer]||'none';if(acc==='none')continue;
        const schema=settings.schema_prefix+layer;
        if(conn.type==='bq')out.push({conn:conn.id,sql:`GRANT \`${acc==='write'?'roles/bigquery.dataEditor':'roles/bigquery.dataViewer'}\` ON SCHEMA \`${conn.endpoint||'<project of the service>'}.${schema}\` TO ${JSON.stringify(who)}`});
        else out.push({conn:conn.id,sql:`GRANT ${acc==='write'?'USE SCHEMA, SELECT, MODIFY':'USE SCHEMA, SELECT'} ON SCHEMA \`${(conn.options||{}).catalog||'main'}\`.\`${schema}\` TO \`${who.replace(/`/g,'')}\``})}}}
  if(apply){for(const g of out)g.result='failed: '+NEEDS_SERVICE(CLOUD_ENGINES[store.connection(g.conn).type]);
    store.audit('Applied grants','access',`0 of ${out.length} statements applied`)}
  return {statements:out}};

tools.call=function(name,args,by,approved){
  /* run a tool. A change that needs approval is parked and returns {status: 'waiting_for_approval'}. */
  const tool=BY_NAME[name];
  if(!tool)throw new ApiError(`Unknown tool ${name}`);
  args={...(args||{})};
  if(tools.needs_approval(tool)&&!approved){
    const req={id:store.next_id('ap'),ts:now_ms(),tool:name,args,by,status:'pending',result:null};
    store.data.approvals.unshift(req);store.save();
    return {status:'waiting_for_approval',approval_id:req.id,note:"A person must approve this change on the MCP page of the control plane."}}
  args._by=by;
  const result=tool.fn(args);
  if(tool.write)store.audit('Tool call',name,`by ${by}`,by);
  return result};

  const req=store.data.approvals.find(x=>x.id===approval_id);
  if(!req||req.status!=='pending')throw new ApiError('That request is no longer waiting');
  if(!ok)Object.assign(req,{status:'rejected',result:{error:'rejected by a person'}});
  else{try{Object.assign(req,{status:'approved',result:tools.call(req.tool,req.args,req.by,true)})}catch(e){Object.assign(req,{status:'failed',result:{error:String(e.message||e)}})}}
  store.audit(ok?'Approved change':'Rejected change',req.tool,`requested by ${req.by}`);
  return req};

/* ---------- mcp_rpc.py: the JSON-RPC handler behind /mcp. Here it is called in the page instead of over HTTP. ---------- */
const MCP_VERSIONS=['2025-06-18','2025-03-26','2024-11-05'];
function mcp_handle(msg,by){by=by||'mcp client';
  const method=msg.method,mid=msg.id;
  if(mid===undefined||mid===null)return null;
  const params=msg.params||{};let result;
  try{
    if(method==='initialize')result={protocolVersion:MCP_VERSIONS.includes(params.protocolVersion)?params.protocolVersion:MCP_VERSIONS[0],capabilities:{tools:{listChanged:false}},
      serverInfo:{name:'medallion-control-plane',version:'1.0.0'},instructions:"Tools to inspect and operate Bronze, Silver and Gold pipelines. Changes may wait for a person's approval."};
    else if(method==='ping')result={};
    else if(method==='tools/list')result={tools:TOOLS.map(t=>({name:t.name,description:t.desc+(t.write?' Changes data: may need approval.':''),inputSchema:t.schema}))};
    else if(method==='tools/call'){
      try{result={content:[{type:'text',text:pyjson(tools.call(params.name,params.arguments||{},by))}],isError:false}}
      catch(e){result={content:[{type:'text',text:String(e.message||e)}],isError:true}}}
    else return {jsonrpc:'2.0',id:mid,error:{code:-32601,message:`Method not found: ${method}`}};
    return {jsonrpc:'2.0',id:mid,result};
  }catch(e){return {jsonrpc:'2.0',id:mid,error:{code:-32603,message:String(e.message||e)}}}}

async function handle(method,path,body){
  method=String(method||'GET').toUpperCase();
  const url=String(path).split('?')[0];
  body=body===undefined||body===null?{}:clone(body);
  for(const r of ROUTES){
    if(r.method!==method)continue;
    const m=r.rx.exec(url);if(!m)continue;
    const P={};r.keys.forEach((k,i)=>{P[k]=decodeURIComponent(m[i+1])});
    const out=r.fn(P,body);
    if(method!=='GET')store.save();
    return clone(out===undefined||out===null?{ok:true}:out)}
  throw new ApiError('The service answered 404',404)}

/* ---------- keeping the work: state, uploaded files and table contents are saved in this browser ---------- */
const LS_KEY='medallion-control-plane-live-v1',LS_MAX=4.5e6;
let storage=null,tickTimer=null;
const info={saved:0,keeps:'nothing',restored:false,note:''};
function snapshot(){const dbs={};
  for(const [cid,eng] of Object.entries(ENGINES)){if(!eng.db)continue;const layers={};
    for(const layer of LAYERS){const sch=eng.schema(layer);
      layers[layer]=eng.query(`SELECT name FROM ${sch}.sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'`).map(t=>{
        const res=eng.db.exec(`SELECT * FROM ${sch}."${String(t.name).replace(/"/g,'""')}"`);
        return {name:t.name,cols:eng.query(`PRAGMA ${sch}.table_info("${String(t.name).replace(/"/g,'""')}")`).map(r=>[r.name,r.type||'']),rows:res.length?res[0].values:[]}})}
    dbs[cid]=layers}
  return {v:1,saved:now_ms(),state:store.data,files:FILES,dbs}}
function forgetTables(){store.data.tstats={};for(const p of store.data.pipelines){p.loaded={};p.pending=[];p.wm=null}}
function restore(snap){
  store.data=Object.assign(EMPTY(),snap.state||{});FILES=snap.files||{};
  for(const k of Object.keys(ENGINES)){try{ENGINES[k].db&&ENGINES[k].db.close()}catch(e){}delete ENGINES[k]}
  /* a run that was in flight when the page closed can never finish */
  for(const r of store.data.runs)if(r.status==='running'){
    r.status='failed';r.end=now_ms();r.failMsg='the page was closed while this run was in progress';
    for(const t of Object.values(r.tasks||{})){if(t.status==='running'||t.status==='retry')t.status='failed';else if(t.status==='queued')t.status='upstream_failed'}}
  if(!snap.dbs){forgetTables();return}
  for(const [cid,layers] of Object.entries(snap.dbs)){
    const conn=store.connection(cid);if(!conn||!ENGINE_TYPES[conn.type])continue;
    const eng=get_engine(conn),db=eng._db();
    for(const layer of LAYERS)for(const t of (layers[layer]||[])){
      const fq=`${eng.schema(layer)}."${String(t.name).replace(/"/g,'""')}"`;
      db.run(`CREATE TABLE ${fq} (`+t.cols.map(([n,ty])=>`"${String(n).replace(/"/g,'""')}"`+(ty?' '+ty:'')).join(', ')+')');
      if(!t.rows.length)continue;
      db.run('BEGIN');const st=db.prepare(`INSERT INTO ${fq} VALUES (`+t.cols.map(()=>'?').join(', ')+')');
      try{for(const row of t.rows)st.run(row)}finally{st.free()}
      db.run('COMMIT')}}}
function persist(){
  if(!storage)return;
  try{
    const snap=snapshot();let text=JSON.stringify(snap),keeps='everything';
    if(text.length>LS_MAX){text=JSON.stringify({...snap,dbs:null});keeps='settings and files'}
    if(text.length>LS_MAX){storage.removeItem(LS_KEY);Object.assign(info,{saved:0,keeps:'nothing',note:'The uploaded files are too large to keep in this browser. They stay until the page is closed.'});return}
    storage.setItem(LS_KEY,text);
    Object.assign(info,{saved:snap.saved,keeps,note:keeps==='everything'?'':'The tables are too large to keep in this browser. After a reload, run each pipeline with a full reload to rebuild them.'});
  }catch(e){Object.assign(info,{saved:0,keeps:'nothing',note:'This browser does not allow the page to save its work, so it lasts until the page is closed.'})}}

INSERT INTO \`${n.silver}\` (${[...sx,'_ingest_ts','row_hash','valid_from','valid_to','is_current'].join(', ')})

  const NW=196,NH=42,GX=40,GY=16,rowsMax=Math.max(...groups.map(g=>g.length)),W=16+groups.length*(NW+GX)-GX+16,H=16+rowsMax*(NH+GY)-GY+16,pos={};
  groups.forEach((g,i)=>{const off=(rowsMax-g.length)*(NH+GY)/2;g.forEach((t,j)=>{pos[t.id]={x:16+i*(NW+GX),y:16+off+j*(NH+GY)}})});
  const edges=p.tasks.flatMap(t=>t.deps.filter(d=>pos[d]).map(d=>{const a=pos[d],b=pos[t.id],x1=a.x+NW,y1=a.y+NH/2,x2=b.x-6,y2=b.y+NH/2,mx=(x1+x2)/2;return `<path class="edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#arr)"/>`})).join('');
  const nodes=p.tasks.map(t=>{const q=pos[t.id],stt=run&&run.tasks?run.tasks[t.id]?run.tasks[t.id].status:'idle':run?(runTasks(run).find(x=>x.t.id===t.id)||{}).status:'idle';const lab=t.label.length>23?t.label.slice(0,22)+'…':t.label;
    return `<g class="node" tabindex="0" role="button" data-act="openTask" data-pid="${p.id}" data-task="${t.id}" aria-label="${esc(t.label)}, ${esc((ST[stt]||['',stt])[1])}"><rect x="${q.x}" y="${q.y}" width="${NW}" height="${NH}" rx="5"/><circle class="l-${t.layer}" cx="${q.x+13}" cy="${q.y+NH/2}" r="5"/><text x="${q.x+25}" y="${q.y+18}">${esc(lab)}</text><text class="sub" x="${q.x+25}" y="${q.y+33}">${esc((ST[stt]||['',stt])[1])}</text><circle class="dot-${stt}" cx="${q.x+NW-13}" cy="${q.y+NH/2}" r="4.5"/></g>`}).join('');
